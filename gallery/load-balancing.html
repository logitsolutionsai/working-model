<script>
const WM = (function () {
'use strict';
// ---- errors.mjs ----
// Errors carry a stable code and a pointer to the exact place in the spec.
// loc = { path: 'rules.on.request', src: '<program text>', pos: <offset> }
// line/col are computed from src+pos so the message can show the offending line.

class ModelError extends Error {
  constructor(code, message, loc, extra) {
    super(message);
    this.name = 'ModelError';
    this.code = code;
    this.loc = loc ? withLineCol(loc) : null;
    if (extra) Object.assign(this, extra);
  }
}

function withLineCol(loc) {
  if (!loc || loc.src == null || loc.pos == null || loc.line != null) return loc;
  let line = 1;
  let col = 1;
  const src = loc.src;
  const end = Math.min(loc.pos, src.length);
  for (let i = 0; i < end; i++) {
    if (src.charCodeAt(i) === 10) { line++; col = 1; } else col++;
  }
  return { ...loc, line, col };
}

// "rules.on.request:3:12" plus a caret excerpt when the source is known.
function describeLoc(loc) {
  if (!loc) return '';
  let s = loc.path || '';
  if (loc.line != null) s += (s ? ':' : '') + loc.line + ':' + loc.col;
  return s;
}

function excerpt(loc) {
  if (!loc || loc.src == null || loc.line == null) return '';
  const lines = loc.src.split('\n');
  const text = lines[loc.line - 1];
  if (text == null) return '';
  return '    ' + text + '\n    ' + ' '.repeat(Math.max(0, loc.col - 1)) + '^';
}

function errorToJSON(e) {
  if (!(e instanceof ModelError)) {
    return { code: 'E_INTERNAL', message: String(e && e.message || e) };
  }
  const out = { code: e.code, message: e.message };
  if (e.loc) {
    out.path = e.loc.path;
    if (e.loc.line != null) { out.line = e.loc.line; out.col = e.loc.col; }
  }
  if (e.hint) out.hint = e.hint;
  return out;
}

// Closest name for "did you mean" hints (small Levenshtein).
function closest(name, candidates) {
  let best = null;
  let bestD = Infinity;
  for (const c of candidates) {
    const d = editDistance(name.toLowerCase(), String(c).toLowerCase());
    if (d < bestD) { bestD = d; best = c; }
  }
  if (best == null) return null;
  return bestD <= Math.max(1, Math.floor(name.length / 3)) ? best : null;
}

function editDistance(a, b) {
  const m = a.length;
  const n = b.length;
  if (Math.abs(m - n) > 3) return 99;
  let prev = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}

// ---- rng.mjs ----
// Seeded pseudo-random numbers. mulberry32 uses only 32-bit integer maths
// (Math.imul and unsigned shifts), so Node and every browser produce the
// same sequence for the same seed.

function makeRng(seed) {
  let a = hashSeed(seed) >>> 0;
  return function next() {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Accepts a number or a string; strings are hashed (FNV-1a) so a claim id
// can seed its own sweep without disturbing the main run.
function hashSeed(seed) {
  if (typeof seed === 'number' && Number.isFinite(seed)) return Math.floor(seed) >>> 0;
  const s = String(seed);
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h >>> 0;
}

// Poisson sample (Knuth) for small means; normal approximation for large ones.
function poisson(rng, mean) {
  if (mean <= 0) return 0;
  if (mean > 50) {
    const u1 = Math.max(rng(), 1e-12);
    const u2 = rng();
    const z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
    return Math.max(0, Math.round(mean + Math.sqrt(mean) * z));
  }
  const L = Math.exp(-mean);
  let k = 0;
  let p = 1;
  do { k++; p *= rng(); } while (p > L);
  return k - 1;
}

// ---- lexer.mjs ----
// Tokenizer for the rule language.
// Token: { type: 'num'|'str'|'ident'|'op'|'nl'|'eof', value, pos }
// Newlines are significant (they end statements) except inside ( ) and [ ].

const OPS3 = ['**='];
const OPS2 = ['**', '==', '!=', '<=', '>=', '+=', '-=', '*=', '/=', '%=', '&&', '||'];
const OPS1 = '+-*/%<>=()[]{},;?:!';

const MAX_SOURCE_LENGTH = 20000;

function tokenize(src, path) {
  if (typeof src !== 'string') {
    throw new ModelError('E_SYNTAX', 'expected a string of rule code', { path });
  }
  if (src.length > MAX_SOURCE_LENGTH) {
    throw new ModelError('E_TOO_LONG', `rule code is longer than ${MAX_SOURCE_LENGTH} characters`, { path, src, pos: 0 });
  }
  const toks = [];
  let i = 0;
  let depth = 0; // ( and [ nesting: newlines inside are ignored
  const n = src.length;
  const err = (code, msg, pos) => new ModelError(code, msg, { path, src, pos });

  while (i < n) {
    const c = src[i];
    if (c === ' ' || c === '\t' || c === '\r') { i++; continue; }
    if (c === '\n') {
      if (depth === 0) toks.push({ type: 'nl', value: '\n', pos: i });
      i++;
      continue;
    }
    if (c === '#' || (c === '/' && src[i + 1] === '/')) {
      while (i < n && src[i] !== '\n') i++;
      continue;
    }
    if (isDigit(c) || (c === '.' && isDigit(src[i + 1]))) {
      const start = i;
      while (i < n && isDigit(src[i])) i++;
      if (src[i] === '.' && isDigit(src[i + 1])) {
        i++;
        while (i < n && isDigit(src[i])) i++;
      } else if (src[i] === '.' && !isIdentStart(src[i + 1])) {
        i++; // "1." is allowed
      }
      if (src[i] === 'e' || src[i] === 'E') {
        let j = i + 1;
        if (src[j] === '+' || src[j] === '-') j++;
        if (isDigit(src[j])) {
          i = j;
          while (i < n && isDigit(src[i])) i++;
        }
      }
      if (isIdentStart(src[i])) throw err('E_SYNTAX', `unexpected "${src[i]}" after a number`, i);
      toks.push({ type: 'num', value: Number(src.slice(start, i)), pos: start });
      continue;
    }
    if (isIdentStart(c)) {
      const start = i;
      while (i < n && isIdentPart(src[i])) i++;
      toks.push({ type: 'ident', value: src.slice(start, i), pos: start });
      continue;
    }
    if (c === '"' || c === "'") {
      const start = i;
      const quote = c;
      i++;
      let out = '';
      while (true) {
        if (i >= n || src[i] === '\n') throw err('E_UNTERMINATED_STRING', 'this string is never closed', start);
        const d = src[i];
        if (d === quote) { i++; break; }
        if (d === '\\') {
          const e = src[i + 1];
          if (e === 'n') out += '\n';
          else if (e === 't') out += '\t';
          else if (e === '\\' || e === '"' || e === "'") out += e;
          else throw err('E_SYNTAX', `unknown escape "\\${e}"`, i);
          i += 2;
          continue;
        }
        out += d;
        i++;
      }
      toks.push({ type: 'str', value: out, pos: start });
      continue;
    }
    if (c === '.') throw err('E_SYNTAX', 'member access with "." is not part of the rule language', i);
    let op = null;
    for (const o of OPS3) if (src.startsWith(o, i)) { op = o; break; }
    if (!op) for (const o of OPS2) if (src.startsWith(o, i)) { op = o; break; }
    if (!op && OPS1.includes(c)) op = c;
    if (!op) throw err('E_SYNTAX', `unexpected character "${c}"`, i);
    if (op === '(' || op === '[') depth++;
    if ((op === ')' || op === ']') && depth > 0) depth--;
    toks.push({ type: 'op', value: op, pos: i });
    i += op.length;
  }
  toks.push({ type: 'eof', value: null, pos: n });
  return toks;
}

function isDigit(c) { return c >= '0' && c <= '9'; }
function isIdentStart(c) { return c != null && ((c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z') || c === '_'); }
function isIdentPart(c) { return isIdentStart(c) || isDigit(c); }

// ---- parser.mjs ----
// Pratt parser for the rule language.
//
// Expressions (lowest to highest binding):
//   c ? a : b            ternary, right associative
//   or  ||
//   and &&
//   not !                prefix; binds looser than comparisons: not a == b  means  not (a == b)
//   == != < <= > >=      comparisons cannot be chained (a < b < c is an error)
//   + -
//   * / %
//   -x +x                unary minus and plus
//   **                   power, right associative; -2 ** 2 == -4
//   f(x)  a[i]           calls and indexing
//
// Statements: let, assignment (= += -= *= /= %= **=), if / else if / else,
// while, for x in list, break, continue, and bare calls such as emit('x').


const KEYWORDS = new Set(['if', 'else', 'while', 'for', 'in', 'let', 'break', 'continue', 'and', 'or', 'not', 'true', 'false', 'null']);
const COMPARE = new Set(['==', '!=', '<', '<=', '>', '>=']);
const ASSIGN = new Set(['=', '+=', '-=', '*=', '/=', '%=', '**=']);
const MAX_DEPTH = 100;

const BP = {
  '?': 2, 'or': 4, '||': 4, 'and': 6, '&&': 6,
  '==': 10, '!=': 10, '<': 10, '<=': 10, '>': 10, '>=': 10,
  '+': 20, '-': 20, '*': 30, '/': 30, '%': 30, '**': 50, '(': 60, '[': 60,
};

function isKeyword(name) { return KEYWORDS.has(name); }

class Parser {
  constructor(src, path) {
    this.src = src;
    this.path = path;
    this.toks = tokenize(src, path);
    this.i = 0;
    this.depth = 0;
  }
  err(code, msg, pos) {
    return new ModelError(code, msg, { path: this.path, src: this.src, pos: pos == null ? this.peek().pos : pos });
  }
  peek(o = 0) { return this.toks[Math.min(this.i + o, this.toks.length - 1)]; }
  next() { return this.toks[this.i++]; }
  isOp(v, o = 0) { const t = this.peek(o); return t.type === 'op' && t.value === v; }
  isWord(v, o = 0) { const t = this.peek(o); return t.type === 'ident' && t.value === v; }
  expectOp(v, what) {
    const t = this.peek();
    if (t.type === 'op' && t.value === v) return this.next();
    throw this.err('E_SYNTAX', `expected "${v}"${what ? ' ' + what : ''} but found ${describe(t)}`, t.pos);
  }
  skipNewlines() { while (this.peek().type === 'nl') this.i++; }
  skipSeparators() { while (this.peek().type === 'nl' || this.isOp(';')) this.i++; }

  // ---- expressions -------------------------------------------------------
  expr(rbp = 0) {
    if (++this.depth > MAX_DEPTH) throw this.err('E_TOO_DEEP', `expression is nested more than ${MAX_DEPTH} levels deep`);
    let left = this.prefix();
    while (true) {
      const t = this.peek();
      const key = t.type === 'op' ? t.value : (t.type === 'ident' && (t.value === 'and' || t.value === 'or') ? t.value : null);
      if (key == null || BP[key] == null) break;
      const lbp = BP[key];
      if (lbp <= rbp) break;
      left = this.infix(left, key, lbp);
    }
    this.depth--;
    return left;
  }

  prefix() {
    const t = this.next();
    if (t.type === 'num') return { k: 'num', v: t.value, pos: t.pos };
    if (t.type === 'str') return { k: 'str', v: t.value, pos: t.pos };
    if (t.type === 'ident') {
      if (t.value === 'true' || t.value === 'false') return { k: 'bool', v: t.value === 'true', pos: t.pos };
      if (t.value === 'null') return { k: 'null', pos: t.pos };
      if (t.value === 'not') return { k: 'not', e: this.expr(8), pos: t.pos };
      if (KEYWORDS.has(t.value)) throw this.err('E_SYNTAX', `"${t.value}" cannot be used inside an expression`, t.pos);
      return { k: 'name', name: t.value, pos: t.pos };
    }
    if (t.type === 'op') {
      if (t.value === '(') {
        const e = this.expr(0);
        this.expectOp(')', 'to close "("');
        return e;
      }
      if (t.value === '[') {
        const items = [];
        if (!this.isOp(']')) {
          while (true) {
            items.push(this.expr(0));
            if (this.isOp(',')) { this.next(); if (this.isOp(']')) break; continue; }
            break;
          }
        }
        this.expectOp(']', 'to close the list');
        return { k: 'list', items, pos: t.pos };
      }
      if (t.value === '-' || t.value === '+') return { k: 'un', op: t.value, e: this.expr(40), pos: t.pos };
      if (t.value === '!') return { k: 'not', e: this.expr(8), pos: t.pos };
    }
    throw this.err('E_SYNTAX', `expected a value but found ${describe(t)}`, t.pos);
  }

  infix(left, key, lbp) {
    const t = this.next();
    if (key === '(') {
      if (left.k !== 'name') throw this.err('E_SYNTAX', 'only named functions can be called', t.pos);
      const args = [];
      if (!this.isOp(')')) {
        while (true) {
          args.push(this.expr(0));
          if (this.isOp(',')) { this.next(); continue; }
          break;
        }
      }
      this.expectOp(')', 'to close the call');
      return { k: 'call', name: left.name, args, pos: left.pos };
    }
    if (key === '[') {
      const idx = this.expr(0);
      this.expectOp(']', 'to close the index');
      return { k: 'index', obj: left, idx, pos: t.pos };
    }
    if (key === '?') {
      this.skipNewlines();
      const a = this.expr(0);
      this.skipNewlines();
      this.expectOp(':', 'in the ternary "c ? a : b"');
      this.skipNewlines();
      const b = this.expr(lbp - 1);
      return { k: 'tern', c: left, a, b, pos: t.pos };
    }
    this.skipNewlines();
    if (key === 'and' || key === '&&') return { k: 'and', l: left, r: this.expr(lbp), pos: t.pos };
    if (key === 'or' || key === '||') return { k: 'or', l: left, r: this.expr(lbp), pos: t.pos };
    if (key === '**') return { k: 'bin', op: '**', l: left, r: this.expr(lbp - 1), pos: t.pos };
    const right = this.expr(lbp);
    const node = { k: 'bin', op: key, l: left, r: right, pos: t.pos };
    if (COMPARE.has(key)) {
      const nt = this.peek();
      if (nt.type === 'op' && COMPARE.has(nt.value)) {
        throw this.err('E_CHAINED_COMPARISON', 'comparisons cannot be chained; write "a < b and b < c"', nt.pos);
      }
    }
    return node;
  }

  // ---- statements --------------------------------------------------------
  program() {
    const body = this.statements(null);
    if (this.peek().type !== 'eof') throw this.err('E_SYNTAX', `unexpected ${describe(this.peek())}`);
    return body;
  }

  statements(closer) {
    const out = [];
    while (true) {
      this.skipSeparators();
      const t = this.peek();
      if (t.type === 'eof') {
        if (closer) throw this.err('E_SYNTAX', 'this block is never closed with "}"', closer.pos);
        break;
      }
      if (closer && this.isOp('}')) break;
      out.push(this.statement());
      const e = this.peek();
      if (!(e.type === 'nl' || e.type === 'eof' || (e.type === 'op' && (e.value === ';' || e.value === '}')))) {
        throw this.err('E_SYNTAX', `expected the end of the statement but found ${describe(e)}`, e.pos);
      }
    }
    return out;
  }

  block() {
    const open = this.expectOp('{', 'to start a block');
    const body = this.statements(open);
    this.expectOp('}', 'to close the block');
    return body;
  }

  statement() {
    if (++this.depth > MAX_DEPTH) throw this.err('E_TOO_DEEP', `blocks are nested more than ${MAX_DEPTH} levels deep`);
    const s = this.statementInner();
    this.depth--;
    return s;
  }

  statementInner() {
    const t = this.peek();
    if (t.type === 'ident') {
      switch (t.value) {
        case 'let': {
          this.next();
          const name = this.next();
          if (name.type !== 'ident' || KEYWORDS.has(name.value)) throw this.err('E_SYNTAX', 'expected a name after "let"', name.pos);
          this.expectOp('=', 'after the name in "let"');
          this.skipNewlines();
          return { k: 'let', name: name.value, e: this.expr(0), pos: t.pos, namePos: name.pos };
        }
        case 'if': return this.ifStatement();
        case 'while': {
          this.next();
          const c = this.expr(0);
          return { k: 'while', c, body: this.block(), pos: t.pos };
        }
        case 'for': {
          this.next();
          const name = this.next();
          if (name.type !== 'ident' || KEYWORDS.has(name.value)) throw this.err('E_SYNTAX', 'expected a loop variable after "for"', name.pos);
          if (!this.isWord('in')) throw this.err('E_SYNTAX', 'expected "in" after the loop variable');
          this.next();
          const iter = this.expr(0);
          return { k: 'for', name: name.value, iter, body: this.block(), pos: t.pos, namePos: name.pos };
        }
        case 'break': this.next(); return { k: 'break', pos: t.pos };
        case 'continue': this.next(); return { k: 'continue', pos: t.pos };
        case 'else': throw this.err('E_SYNTAX', '"else" without a matching "if"', t.pos);
        default: break;
      }
    }
    const e = this.expr(0);
    const a = this.peek();
    if (a.type === 'op' && ASSIGN.has(a.value)) {
      if (e.k !== 'name' && e.k !== 'index') throw this.err('E_SYNTAX', 'only a name or a list element can be assigned to', a.pos);
      this.next();
      this.skipNewlines();
      return { k: 'assign', target: e, op: a.value, e: this.expr(0), pos: a.pos };
    }
    if (e.k !== 'call') {
      throw this.err('E_USELESS_EXPRESSION', 'this line computes a value but does nothing with it; assign it or call a function', e.pos);
    }
    return { k: 'expr', e, pos: e.pos };
  }

  ifStatement() {
    const t = this.next(); // 'if'
    const c = this.expr(0);
    const then = this.block();
    let els = null;
    // allow "}\n else {" by looking past newlines
    let j = 0;
    while (this.peek(j).type === 'nl') j++;
    if (this.isWord('else', j)) {
      this.i += j + 1;
      if (this.isWord('if')) els = [this.ifStatement()];
      else els = this.block();
    }
    return { k: 'if', c, then, else: els, pos: t.pos };
  }
}

function describe(t) {
  if (t.type === 'eof') return 'the end of the code';
  if (t.type === 'nl') return 'a line break';
  if (t.type === 'str') return `the string "${t.value}"`;
  return `"${t.value}"`;
}

function parseProgram(src, path) {
  return new Parser(src, path).program();
}

function parseExpression(src, path) {
  const p = new Parser(src, path);
  p.skipNewlines();
  const e = p.expr(0);
  p.skipNewlines();
  const t = p.peek();
  if (t.type !== 'eof') {
    if (t.type === 'op' && ASSIGN.has(t.value)) {
      throw p.err('E_ASSIGN_IN_EXPRESSION', 'this is an expression, so it cannot assign; use "==" to compare', t.pos);
    }
    throw p.err('E_SYNTAX', `unexpected ${describe(t)} after the expression`, t.pos);
  }
  return e;
}

// ---- compile.mjs ----
// Compiles parsed rule code into plain JavaScript closures.
// There is no eval and no Function constructor: every node becomes a small
// closure over the environment object below, and names are resolved at
// compile time against the spec (locals, state, params, derived values and a
// handful of implicit names). Nothing else is reachable, so code such as
// constructor, __proto__ or globalThis is simply an unknown name.
//
// Runtime environment:
//   env.S  state values (null-prototype object)       env.P  params (null-prototype)
//   env.L  local slots for let and for                env.t, env.dt, env.tick
//   env.seq, env.batch, env.payload                   env.rng() seeded random
//   env.emit(name, payload)                           env.steps / env.maxSteps


const LIMITS = {
  listLength: 10000,
  stringLength: 10000,
  steps: 2000000,
  cells: 1000000, // items in one list value, counting the items of nested lists
  depth: 100, // nesting of list values
  traceCells: 10000000, // values stored across all snapshots of one run
  checkSteps: 200000000, // rule steps plus ticks across every run one claim check makes (sweeps, compares)
};

const IMPLICIT = new Set(['t', 'dt', 'tick', 'seq', 'batch', 'payload', 'pi']);
const JS_MEMBERS = new Set(['constructor', 'prototype', 'toString', 'valueOf', 'hasOwnProperty', 'isPrototypeOf',
  'propertyIsEnumerable', 'toLocaleString', '__defineGetter__', '__defineSetter__', '__lookupGetter__', '__lookupSetter__']);

const NAME_RE = /^[A-Za-z_][A-Za-z0-9_]{0,39}$/;

// Why a spec name is not allowed, or null when it is fine.
function nameProblem(name) {
  if (typeof name !== 'string' || !NAME_RE.test(name)) return 'must start with a letter or "_" and use only letters, digits and "_" (at most 40 characters)';
  if (name.startsWith('__')) return 'names starting with "__" are reserved';
  if (isKeyword(name)) return `"${name}" is a keyword of the rule language`;
  if (IMPLICIT.has(name)) return `"${name}" is a built-in name (${[...IMPLICIT].join(', ')})`;
  if (JS_MEMBERS.has(name)) return `"${name}" is reserved`;
  return null;
}

// ---------------------------------------------------------------- values --

function kindOf(v) {
  if (v === null || v === undefined) return 'null';
  if (Array.isArray(v)) return 'list';
  const k = typeof v;
  if (k === 'number' || k === 'boolean' || k === 'string') return k;
  return 'invalid';
}

function deepCopy(v) {
  if (Array.isArray(v)) {
    const out = new Array(v.length);
    for (let i = 0; i < v.length; i++) out[i] = deepCopy(v[i]);
    return out;
  }
  return v;
}

// box (optional) counts the items compared, so callers can charge the work.
function deepEqual(a, b, box) {
  if (a === b) return true;
  if (Array.isArray(a) && Array.isArray(b)) {
    if (a.length !== b.length) return false;
    if (box) box.n += a.length;
    for (let i = 0; i < a.length; i++) if (!deepEqual(a[i], b[i], box)) return false;
    return true;
  }
  return false;
}

// Copy a list value, counting its items into box.n. Returns undefined (and
// sets box.over to 'cells' or 'depth') when the value is too big or too deep.
function copyBounded(v, box, max, depth = 0) {
  if (!Array.isArray(v)) return v;
  if (depth >= LIMITS.depth) { box.over = 'depth'; return undefined; }
  box.n += v.length;
  if (box.n > max) { box.over = 'cells'; return undefined; }
  const out = new Array(v.length);
  for (let i = 0; i < v.length; i++) {
    const x = v[i];
    if (Array.isArray(x)) {
      const c = copyBounded(x, box, max, depth + 1);
      if (c === undefined) return undefined;
      out[i] = c;
    } else out[i] = x;
  }
  return out;
}

function showValue(v) {
  const k = kindOf(v);
  if (k === 'number') return fmtNum(v);
  if (k === 'string') return JSON.stringify(v);
  if (k === 'list') {
    const items = v.slice(0, 8).map(showValue);
    return '[' + items.join(', ') + (v.length > 8 ? `, … ${v.length} items` : '') + ']';
  }
  return String(v);
}

function fmtNum(x) {
  if (Number.isInteger(x)) return String(x);
  const a = Math.abs(x);
  if (a >= 1000) return x.toFixed(0);
  if (a >= 10) return String(Math.round(x * 100) / 100);
  if (a >= 0.01) return String(Math.round(x * 1000) / 1000);
  return x.toPrecision(3);
}

// ------------------------------------------------------------ builtins --

function typeErr(node, sc, msg) {
  return new ModelError('E_TYPE', msg, loc(sc, node.pos));
}
function loc(sc, pos) { return { path: sc.path, src: sc.src, pos }; }

function needNum(v, node, sc, what) {
  if (typeof v !== 'number') throw typeErr(node, sc, `${what} needs a number, got ${kindOf(v)} ${showValue(v)}`);
  return v;
}
function needList(v, node, sc, what) {
  if (!Array.isArray(v)) throw typeErr(node, sc, `${what} needs a list, got ${kindOf(v)} ${showValue(v)}`);
  return v;
}
function needBool(v, node, sc, what) {
  if (typeof v !== 'boolean') throw typeErr(node, sc, `${what} needs true or false, got ${kindOf(v)} ${showValue(v)}`);
  return v;
}
function finite(x, node, sc) {
  if (!Number.isFinite(x)) throw new ModelError('E_NONFINITE', 'the result is not a finite number (overflow or an undefined operation)', loc(sc, node.pos));
  return x;
}
function checkListSize(list, node, sc) {
  if (list.length > LIMITS.listLength) throw new ModelError('E_LIST_LIMIT', `a list grew past ${LIMITS.listLength} items`, loc(sc, node.pos));
  return list;
}

// Work accounting. Every statement costs one step, and a builtin that walks or
// builds a list costs one step per item, so rules cannot do unbounded work
// inside the step limit (a loop of sorted(range(10000)) used to run for minutes).
function stepLimitError(env, sc, node) {
  return new ModelError('E_STEP_LIMIT', `the rules ran more than ${env.maxSteps} steps in one simulation (copying or scanning a list costs one step per item); is there a loop that never ends, or a big list copied every tick?`, loc(sc, node.pos));
}
function charge(env, n, node, sc) {
  if (!env || !(n > 0)) return;
  env.steps += n;
  if (env.steps > env.maxSteps) throw stepLimitError(env, sc, node);
}
// Strings are capped at LIMITS.stringLength; charge them by the 64 characters.
function chargeText(env, s, node, sc) { charge(env, Math.ceil(s.length / 64), node, sc); }

// Lists are values: storing one (assignment, let, push, a list literal, an
// emit payload) stores a copy. The copy is charged and bounded.
function copyIn(v, env, node, sc) {
  if (!Array.isArray(v)) return v;
  const box = { n: 0, over: null };
  const out = copyBounded(v, box, LIMITS.cells);
  if (out === undefined) {
    if (box.over === 'depth') throw new ModelError('E_TOO_DEEP', `a list is nested more than ${LIMITS.depth} levels deep`, loc(sc, node.pos));
    throw new ModelError('E_LIST_LIMIT', `a list would hold more than ${LIMITS.cells} values, counting the items of nested lists`, loc(sc, node.pos));
  }
  charge(env, box.n, node, sc);
  return out;
}
function equalCharged(a, b, env, node, sc) {
  if (!Array.isArray(a) || !Array.isArray(b)) return deepEqual(a, b);
  const box = { n: 0 };
  const r = deepEqual(a, b, box);
  charge(env, box.n, node, sc);
  return r;
}

function findIndex(list, x, env, node, sc) {
  const box = { n: list.length };
  let found = -1;
  for (let i = 0; i < list.length; i++) if (deepEqual(list[i], x, box)) { found = i; break; }
  charge(env, box.n, node, sc);
  return found;
}

function numsOf(args, node, sc, name, env) {
  const xs = args.length === 1 && Array.isArray(args[0]) ? args[0] : args;
  if (xs.length === 0) throw new ModelError('E_EMPTY_LIST', `${name}() of an empty list`, loc(sc, node.pos));
  charge(env, xs.length, node, sc);
  for (const x of xs) needNum(x, node, sc, name + '()');
  return xs;
}
function listIndex(list, i, node, sc, what) {
  needNum(i, node, sc, what);
  if (!Number.isInteger(i)) throw new ModelError('E_INDEX', `${what} needs a whole number, got ${showValue(i)}`, loc(sc, node.pos));
  const j = i < 0 ? list.length + i : i;
  if (j < 0 || j >= list.length) throw new ModelError('E_INDEX', `index ${i} is outside a list of ${list.length} items`, loc(sc, node.pos));
  return j;
}

// pure: allowed in bindings, captions and claims. Impure functions mutate a
// list or draw random numbers, so they only make sense inside rules.
const BUILTINS = Object.assign(Object.create(null), {
  min: { min: 1, max: 99, pure: true, fn: (a, n, sc, env) => Math.min(...numsOf(a, n, sc, 'min', env)) },
  max: { min: 1, max: 99, pure: true, fn: (a, n, sc, env) => Math.max(...numsOf(a, n, sc, 'max', env)) },
  abs: { min: 1, max: 1, pure: true, fn: (a, n, sc) => Math.abs(needNum(a[0], n, sc, 'abs()')) },
  floor: { min: 1, max: 1, pure: true, fn: (a, n, sc) => Math.floor(needNum(a[0], n, sc, 'floor()')) },
  ceil: { min: 1, max: 1, pure: true, fn: (a, n, sc) => Math.ceil(needNum(a[0], n, sc, 'ceil()')) },
  round: {
    min: 1, max: 2, pure: true, fn: (a, n, sc) => {
      const x = needNum(a[0], n, sc, 'round()');
      if (a.length === 1) return Math.round(x);
      const d = needNum(a[1], n, sc, 'round()');
      const f = Math.pow(10, Math.max(0, Math.min(10, Math.floor(d))));
      return Math.round(x * f) / f;
    },
  },
  sqrt: {
    min: 1, max: 1, pure: true, fn: (a, n, sc) => {
      const x = needNum(a[0], n, sc, 'sqrt()');
      if (x < 0) throw new ModelError('E_DOMAIN', `sqrt() of a negative number (${showValue(x)})`, loc(sc, n.pos));
      return Math.sqrt(x);
    },
  },
  pow: { min: 2, max: 2, pure: true, fn: (a, n, sc) => finite(Math.pow(needNum(a[0], n, sc, 'pow()'), needNum(a[1], n, sc, 'pow()')), n, sc) },
  exp: { min: 1, max: 1, pure: true, fn: (a, n, sc) => finite(Math.exp(needNum(a[0], n, sc, 'exp()')), n, sc) },
  log: {
    min: 1, max: 2, pure: true, fn: (a, n, sc) => {
      const x = needNum(a[0], n, sc, 'log()');
      if (x <= 0) throw new ModelError('E_DOMAIN', `log() of a number that is not positive (${showValue(x)})`, loc(sc, n.pos));
      if (a.length === 1) return Math.log(x);
      const b = needNum(a[1], n, sc, 'log()');
      if (b <= 0 || b === 1) throw new ModelError('E_DOMAIN', 'log() base must be positive and not 1', loc(sc, n.pos));
      return Math.log(x) / Math.log(b);
    },
  },
  clamp: {
    min: 3, max: 3, pure: true, fn: (a, n, sc) => {
      const x = needNum(a[0], n, sc, 'clamp()');
      const lo = needNum(a[1], n, sc, 'clamp()');
      const hi = needNum(a[2], n, sc, 'clamp()');
      return Math.min(hi, Math.max(lo, x));
    },
  },
  sign: { min: 1, max: 1, pure: true, fn: (a, n, sc) => Math.sign(needNum(a[0], n, sc, 'sign()')) },
  sin: { min: 1, max: 1, pure: true, fn: (a, n, sc) => Math.sin(needNum(a[0], n, sc, 'sin()')) },
  cos: { min: 1, max: 1, pure: true, fn: (a, n, sc) => Math.cos(needNum(a[0], n, sc, 'cos()')) },

  rand: {
    min: 0, max: 2, pure: false, random: true, fn: (a, n, sc, env) => {
      const u = env.rng();
      if (a.length === 0) return u;
      if (a.length === 1) return u * needNum(a[0], n, sc, 'rand()');
      const lo = needNum(a[0], n, sc, 'rand()');
      return lo + u * (needNum(a[1], n, sc, 'rand()') - lo);
    },
  },
  randint: {
    min: 2, max: 2, pure: false, random: true, fn: (a, n, sc, env) => {
      const lo = Math.ceil(needNum(a[0], n, sc, 'randint()'));
      const hi = Math.floor(needNum(a[1], n, sc, 'randint()'));
      if (hi < lo) throw new ModelError('E_DOMAIN', `randint(${lo}, ${hi}) has no whole numbers to pick from`, loc(sc, n.pos));
      return lo + Math.floor(env.rng() * (hi - lo + 1));
    },
  },
  chance: { min: 1, max: 1, pure: false, random: true, fn: (a, n, sc, env) => env.rng() < needNum(a[0], n, sc, 'chance()') },
  pick: {
    min: 1, max: 1, pure: false, random: true, fn: (a, n, sc, env) => {
      const l = needList(a[0], n, sc, 'pick()');
      if (l.length === 0) throw new ModelError('E_EMPTY_LIST', 'pick() from an empty list', loc(sc, n.pos));
      return l[Math.floor(env.rng() * l.length)];
    },
  },

  len: {
    min: 1, max: 1, pure: true, fn: (a, n, sc) => {
      const v = a[0];
      if (Array.isArray(v) || typeof v === 'string') return v.length;
      throw typeErr(n, sc, `len() needs a list or a string, got ${kindOf(v)}`);
    },
  },
  push: {
    min: 2, max: 2, pure: false, fn: (a, n, sc, env) => {
      const l = needList(a[0], n, sc, 'push()');
      l.push(copyIn(a[1], env, n, sc));
      checkListSize(l, n, sc);
      return null;
    },
  },
  unshift: {
    min: 2, max: 2, pure: false, fn: (a, n, sc, env) => {
      const l = needList(a[0], n, sc, 'unshift()');
      l.unshift(copyIn(a[1], env, n, sc));
      checkListSize(l, n, sc);
      return null;
    },
  },
  insert: {
    min: 3, max: 3, pure: false, fn: (a, n, sc, env) => {
      const l = needList(a[0], n, sc, 'insert()');
      const i = needNum(a[1], n, sc, 'insert()');
      if (!Number.isInteger(i) || i < 0 || i > l.length) throw new ModelError('E_INDEX', `insert() position ${showValue(i)} is outside 0..${l.length}`, loc(sc, n.pos));
      l.splice(i, 0, copyIn(a[2], env, n, sc));
      checkListSize(l, n, sc);
      return null;
    },
  },
  pop: {
    min: 1, max: 1, pure: false, fn: (a, n, sc) => {
      const l = needList(a[0], n, sc, 'pop()');
      if (l.length === 0) throw new ModelError('E_EMPTY_LIST', 'pop() from an empty list', loc(sc, n.pos));
      return l.pop();
    },
  },
  shift: {
    min: 1, max: 1, pure: false, fn: (a, n, sc) => {
      const l = needList(a[0], n, sc, 'shift()');
      if (l.length === 0) throw new ModelError('E_EMPTY_LIST', 'shift() from an empty list', loc(sc, n.pos));
      return l.shift();
    },
  },
  remove: {
    min: 2, max: 2, pure: false, fn: (a, n, sc, env) => {
      const l = needList(a[0], n, sc, 'remove()');
      const i = findIndex(l, a[1], env, n, sc);
      if (i < 0) return false;
      l.splice(i, 1);
      return true;
    },
  },
  removeAt: {
    min: 2, max: 2, pure: false, fn: (a, n, sc) => {
      const l = needList(a[0], n, sc, 'removeAt()');
      const j = listIndex(l, a[1], n, sc, 'removeAt()');
      return l.splice(j, 1)[0];
    },
  },
  contains: {
    min: 2, max: 2, pure: true, fn: (a, n, sc, env) => findIndex(needList(a[0], n, sc, 'contains()'), a[1], env, n, sc) >= 0,
  },
  indexOf: {
    min: 2, max: 2, pure: true, fn: (a, n, sc, env) => findIndex(needList(a[0], n, sc, 'indexOf()'), a[1], env, n, sc),
  },
  count: {
    min: 2, max: 2, pure: true, fn: (a, n, sc, env) => {
      const l = needList(a[0], n, sc, 'count()');
      const box = { n: l.length };
      let c = 0;
      for (const x of l) if (deepEqual(x, a[1], box)) c++;
      charge(env, box.n, n, sc);
      return c;
    },
  },
  slice: {
    min: 2, max: 3, pure: true, fn: (a, n, sc, env) => {
      const l = a[0];
      if (!Array.isArray(l) && typeof l !== 'string') throw typeErr(n, sc, 'slice() needs a list or a string');
      const s = needNum(a[1], n, sc, 'slice()');
      const e = a.length > 2 ? needNum(a[2], n, sc, 'slice()') : l.length;
      if (Array.isArray(l)) return copyIn(l.slice(s, e), env, n, sc);
      const out = l.slice(s, e);
      chargeText(env, out, n, sc);
      return out;
    },
  },
  sum: {
    min: 1, max: 1, pure: true, fn: (a, n, sc, env) => {
      const l = needList(a[0], n, sc, 'sum()');
      charge(env, l.length, n, sc);
      let s = 0;
      for (const x of l) s += needNum(x, n, sc, 'sum()');
      return finite(s, n, sc);
    },
  },
  mean: {
    min: 1, max: 1, pure: true, fn: (a, n, sc, env) => {
      const l = needList(a[0], n, sc, 'mean()');
      if (l.length === 0) throw new ModelError('E_EMPTY_LIST', 'mean() of an empty list', loc(sc, n.pos));
      charge(env, l.length, n, sc);
      let s = 0;
      for (const x of l) s += needNum(x, n, sc, 'mean()');
      return s / l.length;
    },
  },
  range: {
    min: 1, max: 2, pure: true, fn: (a, n, sc, env) => {
      let lo = 0;
      let hi = needNum(a[0], n, sc, 'range()');
      if (a.length === 2) { lo = hi; hi = needNum(a[1], n, sc, 'range()'); }
      lo = Math.ceil(lo); hi = Math.ceil(hi);
      if (hi - lo > LIMITS.listLength) throw new ModelError('E_LIST_LIMIT', `range() would make more than ${LIMITS.listLength} items`, loc(sc, n.pos));
      charge(env, hi - lo, n, sc);
      const out = [];
      for (let i = lo; i < hi; i++) out.push(i);
      return out;
    },
  },
  fill: {
    min: 2, max: 2, pure: true, fn: (a, n, sc, env) => {
      const k = needNum(a[0], n, sc, 'fill()');
      if (!Number.isInteger(k) || k < 0) throw new ModelError('E_DOMAIN', 'fill() needs a whole number of items', loc(sc, n.pos));
      if (k > LIMITS.listLength) throw new ModelError('E_LIST_LIMIT', `fill() would make more than ${LIMITS.listLength} items`, loc(sc, n.pos));
      const out = new Array(k);
      if (!Array.isArray(a[1])) {
        charge(env, k, n, sc);
        return out.fill(a[1]);
      }
      // a list of lists: check the total size before building anything
      const one = copyIn(a[1], null, n, sc);
      const box = { n: 0 };
      copyBounded(one, box, LIMITS.cells);
      if ((box.n + 1) * k > LIMITS.cells) throw new ModelError('E_LIST_LIMIT', `fill() would make more than ${LIMITS.cells} values, counting the items of nested lists`, loc(sc, n.pos));
      charge(env, (box.n + 1) * k, n, sc);
      for (let i = 0; i < k; i++) out[i] = copyBounded(one, { n: 0 }, LIMITS.cells);
      return out;
    },
  },
  sorted: {
    min: 1, max: 1, pure: true, fn: (a, n, sc, env) => {
      const l = needList(a[0], n, sc, 'sorted()');
      charge(env, l.length * Math.max(1, Math.ceil(Math.log2(l.length + 1))), n, sc);
      const c = l.slice();
      const allNum = c.every((x) => typeof x === 'number');
      const allStr = c.every((x) => typeof x === 'string');
      if (!allNum && !allStr) throw typeErr(n, sc, 'sorted() needs a list of only numbers or only strings');
      return c.sort((x, y) => (x < y ? -1 : x > y ? 1 : 0));
    },
  },
  reversed: { min: 1, max: 1, pure: true, fn: (a, n, sc, env) => copyIn(needList(a[0], n, sc, 'reversed()'), env, n, sc).reverse() },
  str: {
    min: 1, max: 1, pure: true, fn: (a, n, sc, env) => {
      if (typeof a[0] === 'string') return a[0];
      const out = showValue(a[0]);
      chargeText(env, out, n, sc);
      return out;
    },
  },
  emit: { min: 1, max: 2, pure: false, emit: true, fn: null },
});

function builtinNames() { return Object.keys(BUILTINS); }

// ------------------------------------------------------------- compiler --

// sc (compile scope):
//   path, src, mode ('rules' | 'expr'), state:Set, params:Set,
//   derived: Map(name -> closure getter), implicit:Set (extra names allowed),
//   extra: Map(name -> getter) for special scopes such as compare's a and b
//   locals: [Map], slots: {n}, loops: number, emits: Set, refs: Set
function makeScope(base, path, src, mode) {
  return {
    path, src, mode,
    state: base.state || new Set(),
    params: base.params || new Set(),
    derived: base.derived || new Map(),
    implicit: base.implicit || new Set(['t', 'dt', 'tick', 'pi']),
    extra: base.extra || new Map(),
    readonlyState: !!base.readonlyState,
    what: base.what,
    locals: [new Map()],
    slots: { n: 0 },
    loops: 0,
    emits: base.emits || new Set(),
    refs: new Set(),
  };
}

function compileProgramSource(src, path, base) {
  return compileProgramAst(parseProgram(src, path), src, path, base);
}

// Compile an already parsed program. `check --mutate` uses this to compile
// rule code whose syntax tree it has changed on purpose.
function compileProgramAst(ast, src, path, base) {
  const sc = makeScope(base, path, src, 'rules');
  const run = compileBlock(ast, sc);
  const nslots = () => sc.slots.n;
  const fn = (env) => {
    env.L = new Array(nslots());
    run(env);
  };
  fn.refs = sc.refs;
  fn.emits = sc.emits;
  return fn;
}

function compileExpressionSource(src, path, base) {
  const sc = makeScope(base, path, src, 'expr');
  const ast = parseExpression(src, path);
  const f = compileExpr(ast, sc);
  const fn = (env) => {
    if (!env.L) env.L = [];
    return f(env);
  };
  fn.refs = sc.refs;
  fn.ast = ast;
  return fn;
}

function lookupLocal(sc, name) {
  for (let i = sc.locals.length - 1; i >= 0; i--) {
    const m = sc.locals[i];
    if (m.has(name)) return m.get(name);
  }
  return undefined;
}

function unknownName(sc, node, name) {
  const pool = [...sc.state, ...sc.params, ...sc.derived.keys(), ...sc.implicit, ...sc.extra.keys()];
  for (const m of sc.locals) pool.push(...m.keys());
  const guess = closest(name, pool);
  const e = new ModelError('E_UNKNOWN_NAME', `unknown name "${name}"` + (guess ? `; did you mean "${guess}"?` : ''), loc(sc, node.pos));
  e.hint = guess ? `use ${guess}` : (sc.mode === 'rules' ? 'declare it in "state", or create a local with let' : 'only state, params, derived values and t can be used here');
  return e;
}

function compileName(node, sc) {
  const name = node.name;
  const slot = lookupLocal(sc, name);
  if (slot !== undefined) return (env) => env.L[slot];
  if (sc.extra.has(name)) { sc.refs.add(name); return sc.extra.get(name); }
  if (sc.implicit.has(name)) {
    sc.refs.add(name);
    switch (name) {
      case 't': return (env) => env.t;
      case 'dt': return (env) => env.dt;
      case 'tick': return (env) => env.tick;
      case 'seq': return (env) => env.seq;
      case 'batch': return (env) => env.batch;
      case 'payload': return (env) => (env.payload === undefined ? null : env.payload);
      case 'pi': return () => Math.PI;
      default: break;
    }
  }
  if (sc.state.has(name)) { sc.refs.add(name); return (env) => env.S[name]; }
  if (sc.params.has(name)) { sc.refs.add(name); return (env) => env.P[name]; }
  if (sc.derived.has(name)) { sc.refs.add(name); const g = sc.derived.get(name); return (env) => g(env); }
  throw unknownName(sc, node, name);
}

function compileExpr(node, sc) {
  switch (node.k) {
    case 'num': { const v = node.v; return () => v; }
    case 'str': { const v = node.v; return () => v; }
    case 'bool': { const v = node.v; return () => v; }
    case 'null': return () => null;
    case 'name': return compileName(node, sc);
    case 'list': {
      const items = node.items.map((x) => compileExpr(x, sc));
      return (env) => {
        const out = new Array(items.length);
        for (let i = 0; i < items.length; i++) out[i] = copyIn(items[i](env), env, node, sc);
        return checkListSize(out, node, sc);
      };
    }
    case 'un': {
      const e = compileExpr(node.e, sc);
      if (node.op === '-') return (env) => -needNum(e(env), node, sc, 'unary "-"');
      return (env) => needNum(e(env), node, sc, 'unary "+"');
    }
    case 'not': {
      const e = compileExpr(node.e, sc);
      return (env) => !needBool(e(env), node, sc, '"not"');
    }
    case 'and': {
      const l = compileExpr(node.l, sc);
      const r = compileExpr(node.r, sc);
      return (env) => needBool(l(env), node, sc, '"and"') && needBool(r(env), node, sc, '"and"');
    }
    case 'or': {
      const l = compileExpr(node.l, sc);
      const r = compileExpr(node.r, sc);
      return (env) => needBool(l(env), node, sc, '"or"') || needBool(r(env), node, sc, '"or"');
    }
    case 'tern': {
      const c = compileExpr(node.c, sc);
      const a = compileExpr(node.a, sc);
      const b = compileExpr(node.b, sc);
      return (env) => (needBool(c(env), node, sc, 'the condition of "? :"') ? a(env) : b(env));
    }
    case 'bin': return compileBinary(node, sc);
    case 'index': {
      const o = compileExpr(node.obj, sc);
      const ix = compileExpr(node.idx, sc);
      return (env) => {
        const v = o(env);
        if (!Array.isArray(v) && typeof v !== 'string') throw typeErr(node, sc, `only lists and strings can be indexed, got ${kindOf(v)}`);
        const j = listIndex(v, ix(env), node, sc, 'an index');
        return v[j];
      };
    }
    case 'call': return compileCall(node, sc);
    default:
      throw new ModelError('E_SYNTAX', `unsupported expression "${node.k}"`, loc(sc, node.pos));
  }
}

function arith(op, a, b, node, sc, env) {
  switch (op) {
    case '+':
      if (typeof a === 'number' && typeof b === 'number') return finite(a + b, node, sc);
      if (typeof a === 'string' && typeof b === 'string') {
        const s = a + b;
        if (s.length > LIMITS.stringLength) throw new ModelError('E_STRING_LIMIT', `a string grew past ${LIMITS.stringLength} characters`, loc(sc, node.pos));
        chargeText(env, s, node, sc);
        return s;
      }
      if (Array.isArray(a) && Array.isArray(b)) return checkListSize(copyIn(a.concat(b), env, node, sc), node, sc);
      throw typeErr(node, sc, `"+" needs two numbers, two strings or two lists, got ${kindOf(a)} and ${kindOf(b)} (use str() to turn a number into text)`);
    case '-': return finite(needNum(a, node, sc, '"-"') - needNum(b, node, sc, '"-"'), node, sc);
    case '*': return finite(needNum(a, node, sc, '"*"') * needNum(b, node, sc, '"*"'), node, sc);
    case '/': {
      const x = needNum(a, node, sc, '"/"');
      const y = needNum(b, node, sc, '"/"');
      if (y === 0) throw new ModelError('E_DIV_ZERO', 'division by zero', loc(sc, node.pos));
      return finite(x / y, node, sc);
    }
    case '%': {
      const x = needNum(a, node, sc, '"%"');
      const y = needNum(b, node, sc, '"%"');
      if (y === 0) throw new ModelError('E_DIV_ZERO', 'remainder by zero', loc(sc, node.pos));
      return finite(x - y * Math.floor(x / y), node, sc);
    }
    case '**': return finite(Math.pow(needNum(a, node, sc, '"**"'), needNum(b, node, sc, '"**"')), node, sc);
    default: throw new ModelError('E_SYNTAX', `unknown operator ${op}`, loc(sc, node.pos));
  }
}

function compare(op, a, b, node, sc, env) {
  if (op === '==') return equalCharged(a, b, env, node, sc);
  if (op === '!=') return !equalCharged(a, b, env, node, sc);
  const ka = kindOf(a);
  const kb = kindOf(b);
  if (!((ka === 'number' && kb === 'number') || (ka === 'string' && kb === 'string'))) {
    throw typeErr(node, sc, `"${op}" compares two numbers or two strings, got ${ka} and ${kb}`);
  }
  switch (op) {
    case '<': return a < b;
    case '<=': return a <= b;
    case '>': return a > b;
    default: return a >= b;
  }
}

function compileBinary(node, sc) {
  const l = compileExpr(node.l, sc);
  const r = compileExpr(node.r, sc);
  const op = node.op;
  if (op === '==' || op === '!=' || op === '<' || op === '<=' || op === '>' || op === '>=') {
    return (env) => compare(op, l(env), r(env), node, sc, env);
  }
  return (env) => arith(op, l(env), r(env), node, sc, env);
}

function compileCall(node, sc) {
  const b = BUILTINS[node.name];
  if (!b) {
    const guess = closest(node.name, Object.keys(BUILTINS));
    const e = new ModelError('E_UNKNOWN_FUNCTION', `unknown function "${node.name}"` + (guess ? `; did you mean "${guess}"?` : ''), loc(sc, node.pos));
    e.hint = 'available: ' + Object.keys(BUILTINS).join(', ');
    throw e;
  }
  const n = node.args.length;
  if (n < b.min || n > b.max) {
    const want = b.min === b.max ? `${b.min}` : b.max >= 99 ? `at least ${b.min}` : `${b.min} to ${b.max}`;
    throw new ModelError('E_ARITY', `${node.name}() takes ${want} argument${want === '1' ? '' : 's'}, got ${n}`, loc(sc, node.pos));
  }
  if (!b.pure && sc.mode !== 'rules') {
    throw new ModelError('E_IMPURE', `${node.name}() ${b.random ? 'draws random numbers' : b.emit ? 'fires an effect' : 'changes a list'}, so it can only be used in rules, not in ${sc.what || 'an expression'}`, loc(sc, node.pos));
  }
  if (b.emit) {
    const nameArg = node.args[0];
    if (nameArg.k !== 'str') throw new ModelError('E_EMIT_NAME', 'emit() needs a quoted name as its first argument, such as emit(\'accept\')', loc(sc, nameArg.pos));
    const ename = nameArg.v;
    if (!/^[A-Za-z_][A-Za-z0-9_-]{0,39}$/.test(ename) || ename.startsWith('__')) throw new ModelError('E_EMIT_NAME', `emit name "${ename}" must use letters, digits, "-" and "_", and not start with "__"`, loc(sc, nameArg.pos));
    sc.emits.add(ename);
    const p = node.args[1] ? compileExpr(node.args[1], sc) : null;
    return (env) => { env.emit(ename, p ? copyIn(p(env), env, node, sc) : null); return null; };
  }
  const args = node.args.map((a) => compileExpr(a, sc));
  const fn = b.fn;
  if (args.length === 1) {
    const a0 = args[0];
    return (env) => fn([a0(env)], node, sc, env);
  }
  return (env) => {
    const vals = new Array(args.length);
    for (let i = 0; i < args.length; i++) vals[i] = args[i](env);
    return fn(vals, node, sc, env);
  };
}

// ---------------------------------------------------------- statements --

const NORMAL = 0;
const BREAK = 1;
const CONTINUE = 2;

function tick(env, node, sc) {
  if (++env.steps > env.maxSteps) throw stepLimitError(env, sc, node);
}

function compileBlock(stmts, sc) {
  sc.locals.push(new Map());
  const fns = stmts.map((s) => compileStmt(s, sc));
  sc.locals.pop();
  const n = fns.length;
  return (env) => {
    for (let i = 0; i < n; i++) {
      const sig = fns[i](env);
      if (sig !== NORMAL) return sig;
    }
    return NORMAL;
  };
}

function declareLocal(sc, name, node) {
  const where = loc(sc, node.namePos != null ? node.namePos : node.pos);
  if (sc.state.has(name) || sc.params.has(name) || sc.derived.has(name) || sc.implicit.has(name) || sc.extra.has(name)) {
    throw new ModelError('E_SHADOW', `"${name}" is already a ${sc.state.has(name) ? 'state value' : sc.params.has(name) ? 'param' : sc.derived.has(name) ? 'derived value' : 'built-in name'}; pick another name for the local`, where);
  }
  const top = sc.locals[sc.locals.length - 1];
  if (top.has(name)) throw new ModelError('E_DUPLICATE_LET', `"${name}" is already declared in this block`, where);
  const slot = sc.slots.n++;
  top.set(name, slot);
  return slot;
}

function stateWriter(sc, name, node) {
  return (env, v) => {
    const k = kindOf(v);
    if (k === 'number' && !Number.isFinite(v)) throw new ModelError('E_NONFINITE', `"${name}" would become a non-finite number`, loc(sc, node.pos));
    const want = env.kinds && env.kinds[name];
    if (want && want !== k && !(want === 'null' || k === 'null')) {
      throw new ModelError('E_TYPE_CHANGE', `"${name}" holds a ${want} but this assigns a ${k} (${showValue(v)})`, loc(sc, node.pos));
    }
    env.S[name] = v;
  };
}

function compileStmt(node, sc) {
  switch (node.k) {
    case 'let': {
      const e = compileExpr(node.e, sc);
      const slot = declareLocal(sc, node.name, node);
      return (env) => { tick(env, node, sc); env.L[slot] = copyIn(e(env), env, node, sc); return NORMAL; };
    }
    case 'assign': return compileAssign(node, sc);
    case 'if': {
      const c = compileExpr(node.c, sc);
      const a = compileBlock(node.then, sc);
      const b = node.else ? compileBlock(node.else, sc) : null;
      return (env) => {
        tick(env, node, sc);
        if (needBool(c(env), node, sc, 'the condition of "if"')) return a(env);
        return b ? b(env) : NORMAL;
      };
    }
    case 'while': {
      const c = compileExpr(node.c, sc);
      sc.loops++;
      const body = compileBlock(node.body, sc);
      sc.loops--;
      return (env) => {
        while (true) {
          tick(env, node, sc);
          if (!needBool(c(env), node, sc, 'the condition of "while"')) break;
          const sig = body(env);
          if (sig === BREAK) break;
        }
        return NORMAL;
      };
    }
    case 'for': {
      const it = compileExpr(node.iter, sc);
      sc.locals.push(new Map());
      const slot = declareLocal(sc, node.name, node);
      sc.loops++;
      const body = compileBlock(node.body, sc);
      sc.loops--;
      sc.locals.pop();
      return (env) => {
        const list = it(env);
        if (!Array.isArray(list)) throw typeErr(node, sc, `"for ... in" needs a list, got ${kindOf(list)}`);
        const items = copyIn(list, env, node, sc);
        for (let i = 0; i < items.length; i++) {
          tick(env, node, sc);
          env.L[slot] = items[i];
          const sig = body(env);
          if (sig === BREAK) break;
        }
        return NORMAL;
      };
    }
    case 'break':
    case 'continue': {
      if (sc.loops === 0) throw new ModelError('E_BREAK_OUTSIDE_LOOP', `"${node.k}" can only be used inside a loop`, loc(sc, node.pos));
      const sig = node.k === 'break' ? BREAK : CONTINUE;
      return () => sig;
    }
    case 'expr': {
      const e = compileExpr(node.e, sc);
      return (env) => { tick(env, node, sc); e(env); return NORMAL; };
    }
    default:
      throw new ModelError('E_SYNTAX', `unsupported statement "${node.k}"`, loc(sc, node.pos));
  }
}

function compileAssign(node, sc) {
  const op = node.op;
  const rhs = compileExpr(node.e, sc);
  const bop = op === '=' ? null : op.slice(0, -1);
  const tgt = node.target;
  if (tgt.k === 'name') {
    const name = tgt.name;
    const slot = lookupLocal(sc, name);
    if (slot !== undefined) {
      return (env) => {
        tick(env, node, sc);
        const v = rhs(env);
        env.L[slot] = bop ? arith(bop, env.L[slot], v, node, sc, env) : copyIn(v, env, node, sc);
        return NORMAL;
      };
    }
    if (sc.state.has(name)) {
      if (sc.readonlyState) throw new ModelError('E_ASSIGN_READONLY', `"${name}" cannot be changed here`, loc(sc, tgt.pos));
      sc.refs.add(name);
      const write = stateWriter(sc, name, node);
      return (env) => {
        tick(env, node, sc);
        const v = rhs(env);
        write(env, bop ? arith(bop, env.S[name], v, node, sc, env) : copyIn(v, env, node, sc));
        return NORMAL;
      };
    }
    if (sc.params.has(name)) throw new ModelError('E_ASSIGN_READONLY', `"${name}" is a param (a slider), so rules cannot change it; copy it into state if it must change`, loc(sc, tgt.pos));
    if (sc.derived.has(name)) throw new ModelError('E_ASSIGN_READONLY', `"${name}" is a derived value, computed from state; change the state it depends on instead`, loc(sc, tgt.pos));
    if (sc.implicit.has(name) || sc.extra.has(name)) throw new ModelError('E_ASSIGN_READONLY', `"${name}" is a built-in name and cannot be assigned`, loc(sc, tgt.pos));
    throw unknownName(sc, tgt, name);
  }
  // list element: a[i] = v, a[i][j] += v
  const obj = compileExpr(tgt.obj, sc);
  const idx = compileExpr(tgt.idx, sc);
  if (sc.readonlyState) {
    let root = tgt;
    while (root.k === 'index') root = root.obj;
    if (root.k === 'name' && sc.state.has(root.name)) throw new ModelError('E_ASSIGN_READONLY', `"${root.name}" cannot be changed here`, loc(sc, tgt.pos));
  }
  return (env) => {
    tick(env, node, sc);
    const list = obj(env);
    if (!Array.isArray(list)) throw typeErr(tgt, sc, `only list elements can be assigned with [ ], got ${kindOf(list)}`);
    const j = listIndex(list, idx(env), tgt, sc, 'an index');
    const v = rhs(env);
    const nv = bop ? arith(bop, list[j], v, node, sc, env) : copyIn(v, env, node, sc);
    if (typeof nv === 'number' && !Number.isFinite(nv)) throw new ModelError('E_NONFINITE', 'a list element would become a non-finite number', loc(sc, node.pos));
    list[j] = nv;
    return NORMAL;
  };
}

// ---- format.mjs ----
// Number formatting and text templates shared by the CLI and the page.
// A template is plain text with {expr} or {expr:format} holes:
//   "{capacity} tokens"          -> "10 tokens"
//   "{capacity + 1:ord} request" -> "11th request"
//   "{share:%}" / "{share:.1%}"  -> "42%" / "41.7%"
//   "{balance:,.2}"              -> "12,345.68"
//   "{{" and "}}"                -> literal braces


const FORMAT_RE = /^(,)?(?:\.(\d))?(%|ord|int)?$/;

function formatNumber(x, fmt) {
  if (typeof x !== 'number') return showValue(x);
  if (!Number.isFinite(x)) return String(x);
  const spec = fmt ? FORMAT_RE.exec(fmt) : null;
  const group = spec ? !!spec[1] : Math.abs(x) >= 10000;
  const digits = spec && spec[2] != null ? Number(spec[2]) : null;
  const kind = spec ? spec[3] : null;
  if (kind === 'ord') return ordinal(Math.round(x));
  if (kind === 'int') return groupDigits(String(Math.round(x)), group);
  if (kind === '%') {
    const v = x * 100;
    return groupDigits(v.toFixed(digits == null ? 0 : digits), group) + '%';
  }
  if (digits != null) return groupDigits(fixZero(x.toFixed(digits)), group);
  return groupDigits(autoNumber(x), group);
}

function fixZero(s) { return /^-0(\.0*)?$/.test(s) ? s.slice(1) : s; }

function autoNumber(x) {
  if (Number.isInteger(x)) return String(x);
  const a = Math.abs(x);
  let s;
  if (a >= 1000) s = x.toFixed(0);
  else if (a >= 1) s = x.toFixed(2);
  else if (a >= 0.001) s = x.toPrecision(2);
  else if (a === 0) s = '0';
  else s = x.toExponential(1);
  if (s.includes('.') && !s.includes('e')) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return fixZero(s);
}

function groupDigits(s, group) {
  if (!group) return s;
  const m = /^(-?)(\d+)(.*)$/.exec(s);
  if (!m) return s;
  return m[1] + m[2].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + m[3];
}

// "1 requests" reads wrong; drop the plural s for exactly one.
function unitFor(value, unit) {
  if (!unit) return '';
  if (value === 1 && /[a-z]s$/.test(unit) && !/ss$/.test(unit) && !/ per /.test(unit)) return unit.slice(0, -1);
  return unit;
}

function ordinal(n) {
  const a = Math.abs(n) % 100;
  if (a >= 11 && a <= 13) return n + 'th';
  switch (Math.abs(n) % 10) {
    case 1: return n + 'st';
    case 2: return n + 'nd';
    case 3: return n + 'rd';
    default: return n + 'th';
  }
}

function formatValue(v, fmt) {
  const k = kindOf(v);
  if (k === 'number') return formatNumber(v, fmt);
  if (k === 'string') return v;
  if (k === 'boolean') return v ? 'yes' : 'no';
  if (k === 'null') return '–';
  return showValue(v);
}

// Split a template into literal text and {expression} holes.
// Returns [{ lit }, { expr, fmt, pos }] where pos is the offset of expr.
function parseTemplate(text, path) {
  const parts = [];
  let lit = '';
  let i = 0;
  const n = text.length;
  while (i < n) {
    const c = text[i];
    if (c === '{' && text[i + 1] === '{') { lit += '{'; i += 2; continue; }
    if (c === '}' && text[i + 1] === '}') { lit += '}'; i += 2; continue; }
    if (c === '}') throw new ModelError('E_TEMPLATE', 'a "}" without a matching "{" (write "}}" for a literal brace)', { path, src: text, pos: i });
    if (c !== '{') { lit += c; i++; continue; }
    // find the matching close brace, skipping strings and nested brackets
    let j = i + 1;
    let depth = 0;
    let quote = null;
    for (; j < n; j++) {
      const d = text[j];
      if (quote) { if (d === '\\') j++; else if (d === quote) quote = null; continue; }
      if (d === '"' || d === "'") { quote = d; continue; }
      if (d === '(' || d === '[' || d === '{') depth++;
      else if (d === ')' || d === ']') depth--;
      else if (d === '}') { if (depth === 0) break; depth--; }
    }
    if (j >= n) throw new ModelError('E_TEMPLATE', 'a "{" is never closed', { path, src: text, pos: i });
    const inner = text.slice(i + 1, j);
    // a trailing :format only counts when it is a known format
    let expr = inner;
    let fmt = null;
    const k = inner.lastIndexOf(':');
    if (k >= 0) {
      const cand = inner.slice(k + 1).trim();
      if (FORMAT_RE.test(cand) && cand.length > 0) { expr = inner.slice(0, k); fmt = cand; }
    }
    if (!expr.trim()) throw new ModelError('E_TEMPLATE', 'an empty {} in the text', { path, src: text, pos: i });
    if (lit) { parts.push({ lit }); lit = ''; }
    parts.push({ expr, fmt, pos: i + 1 });
    i = j + 1;
  }
  if (lit) parts.push({ lit });
  return parts;
}

// Compile a template into a function env -> string. Errors point into the
// template text itself.
function compileTemplate(text, path, base) {
  const parts = parseTemplate(text, path);
  const refs = new Set();
  const fns = parts.map((p) => {
    if (p.lit != null) { const s = p.lit; return () => s; }
    let f;
    try {
      f = compileExpressionSource(p.expr, path, base);
    } catch (e) {
      if (e instanceof ModelError && e.loc) {
        // re-point the error at the template text
        const off = e.loc.pos != null ? e.loc.pos : 0;
        throw new ModelError(e.code, e.message, { path, src: text, pos: p.pos + off }, { hint: e.hint });
      }
      throw e;
    }
    for (const r of f.refs) refs.add(r);
    p.refs = f.refs; // per hole, for lint
    const fmt = p.fmt;
    return (env) => formatValue(f(env), fmt);
  });
  const fn = (env) => {
    let s = '';
    for (const f of fns) s += f(env);
    return s;
  };
  fn.refs = refs;
  fn.parts = parts;
  return fn;
}

// Text outside the {holes}, for lint.
function literalText(text) {
  try {
    return parseTemplate(text, '').filter((p) => p.lit != null).map((p) => p.lit).join(' ');
  } catch {
    return text;
  }
}

// ---- model.mjs ----
// Turns a parsed *.model.json spec into a runnable model: checks names and
// references, compiles every piece of rule code, binding, caption and claim,
// and collects every error it finds (not just the first).



const PART_TYPES = ['box', 'tank', 'queue', 'stack', 'grid', 'counter', 'gauge', 'lamp', 'node', 'link', 'chart', 'label', 'group'];
const CLAIM_KINDS = ['at', 'always', 'never', 'eventually', 'whenever', 'sweep', 'compare'];
const TONES = ['ink', 'muted', 'accent', 'ok', 'bad', 'warn', 'soft', 'info'];
const AGGS = ['max', 'min', 'mean', 'final', 'sum', 'at'];

function codeText(code) {
  return Array.isArray(code) ? code.join('\n') : String(code);
}

function compileModel(spec) {
  const errors = [];
  const warnings = [];
  const attempt = (fn) => {
    try { return fn(); } catch (e) {
      if (e instanceof ModelError) { errors.push(e); return null; }
      throw e;
    }
  };
  const fail = (code, msg, path, hint) => { const e = new ModelError(code, msg, { path }); if (hint) e.hint = hint; errors.push(e); };

  const dt = spec.dt;
  const duration = spec.duration;
  if (!(dt > 0)) fail('E_TIME', '"dt" must be a positive number', 'dt');
  if (!(duration > 0)) fail('E_TIME', '"duration" must be a positive number', 'duration');
  const K = dt > 0 && duration > 0 ? Math.round(duration / dt) : 0;
  if (K > 100000) fail('E_TIME', `duration / dt makes ${K} ticks; keep it under 100000`, 'duration');
  if (dt > 0 && duration > 0 && Math.abs(K * dt - duration) > dt * 1e-6) {
    warnings.push(warn('W_DURATION_ROUNDED', `duration ${duration} is not a whole number of ticks of ${dt}; the run ends at ${K * dt}`, 'duration'));
  }

  // ---- names ---------------------------------------------------------------
  const owners = new Map(); // name -> what
  const claimName = (name, what, path) => {
    const p = nameProblem(name);
    if (p) { fail('E_NAME', `${what} name "${name}": ${p}`, path); return false; }
    if (owners.has(name)) { fail('E_DUPLICATE_NAME', `"${name}" is used as both ${owners.get(name)} and ${what}`, path); return false; }
    owners.set(name, what);
    return true;
  };

  const params = [];
  const paramIds = new Set();
  (spec.params || []).forEach((p, i) => {
    const path = `params[${i}]`;
    if (!claimName(p.id, 'a param', path + '.id')) return;
    const step = p.step != null ? p.step : niceStep(p.min, p.max);
    if (!(p.max > p.min)) fail('E_PARAM_RANGE', `param "${p.id}": max must be greater than min`, path);
    if (!(step > 0)) fail('E_PARAM_RANGE', `param "${p.id}": step must be positive`, path + '.step');
    if (p.default < p.min || p.default > p.max) fail('E_PARAM_RANGE', `param "${p.id}": default ${p.default} is outside ${p.min}..${p.max}`, path + '.default');
    if (p.choices && Math.round((p.max - p.min) / step) + 1 !== p.choices.length) {
      fail('E_PARAM_RANGE', `param "${p.id}": ${p.choices.length} choices but min, max and step give ${Math.round((p.max - p.min) / step) + 1} values`, path + '.choices');
    }
    paramIds.add(p.id);
    params.push({ id: p.id, label: p.label || p.id, min: p.min, max: p.max, step, default: p.default, unit: p.unit || '', help: p.help || '', format: p.format || null, choices: p.choices || null });
  });

  const stateNames = Object.keys(spec.state || {});
  stateNames.forEach((name) => claimName(name, 'a state value', `state.${name}`));
  const derivedNames = Object.keys(spec.derived || {});
  derivedNames.forEach((name) => claimName(name, 'a derived value', `derived.${name}`));

  const stateSet = new Set(stateNames);
  const emits = new Set();

  // ---- state initial values -------------------------------------------------
  const stateInit = [];
  const earlier = new Set();
  for (const name of stateNames) {
    const v = spec.state[name];
    const path = `state.${name}`;
    if (typeof v === 'string') {
      const fn = attempt(() => compileExpressionSource(v, path, { params: paramIds, state: new Set(earlier), implicit: new Set(['pi']), what: 'a starting value' }));
      stateInit.push({ name, fn });
    } else {
      const k = kindOf(v);
      if (k === 'invalid' || (k === 'list' && !validLiteral(v))) fail('E_STATE_VALUE', `state "${name}" must be a number, true/false, a list, or a string expression`, path);
      stateInit.push({ name, value: v });
    }
    earlier.add(name);
  }

  // ---- derived values (each may use earlier ones) -----------------------------
  const derivedGetters = new Map();
  const derived = [];
  for (const name of derivedNames) {
    const path = `derived.${name}`;
    const fn = attempt(() => compileExpressionSource(String(spec.derived[name]), path, {
      params: paramIds, state: stateSet, derived: new Map(derivedGetters), what: 'a derived value',
    }));
    if (fn) {
      derivedGetters.set(name, fn);
      derived.push({ name, fn });
    }
  }

  const exprBase = (what) => ({ params: paramIds, state: stateSet, derived: derivedGetters, what });
  const paramOnly = (what) => ({ params: paramIds, implicit: new Set(['pi']), what });

  // ---- events ---------------------------------------------------------------
  const events = [];
  const eventNames = new Set();
  (spec.events || []).forEach((ev, i) => {
    const path = `events[${i}]`;
    if (typeof ev.name !== 'string' || !/^[A-Za-z_][A-Za-z0-9_-]{0,39}$/.test(ev.name) || ev.name.startsWith('__')) {
      fail('E_NAME', `event name "${ev.name}" must use letters, digits, "-" and "_", and not start with "__"`, path + '.name');
      return;
    }
    eventNames.add(ev.name);
    const num = (key, dflt) => {
      const v = ev[key];
      if (v == null) return dflt == null ? null : () => dflt;
      if (typeof v === 'number') return () => v;
      const f = attempt(() => compileExpressionSource(String(v), `${path}.${key}`, paramOnly('an event time')));
      return f ? (env) => f(env) : null;
    };
    const modes = ['at', 'every', 'rate'].filter((k) => ev[k] != null);
    if (modes.length !== 1) {
      fail('E_EVENT', `event "${ev.name}" needs exactly one of "at", "every" or "rate"`, path);
      return;
    }
    const mode = modes[0];
    let atList = null;
    if (mode === 'at' && Array.isArray(ev.at)) atList = ev.at.slice();
    events.push({
      name: ev.name, index: i, mode, path, label: ev.label || null,
      at: mode === 'at' && !atList ? num('at') : null,
      atList,
      every: mode === 'every' ? num('every') : null,
      rate: mode === 'rate' ? num('rate') : null,
      from: num('from', null),
      until: num('until', null),
      count: num('count', 1),
    });
  });

  // ---- rules ----------------------------------------------------------------
  const rules = { init: null, tick: null, on: new Map() };
  const ruleBase = (implicit) => ({ params: paramIds, state: stateSet, derived: derivedGetters, implicit: new Set(implicit), emits });
  const R = spec.rules || {};
  if (R.init != null) rules.init = attempt(() => compileProgramSource(codeText(R.init), 'rules.init', ruleBase(['t', 'dt', 'tick', 'pi'])));
  if (R.tick != null) rules.tick = attempt(() => compileProgramSource(codeText(R.tick), 'rules.tick', ruleBase(['t', 'dt', 'tick', 'pi'])));
  for (const [name, code] of Object.entries(R.on || {})) {
    const path = `rules.on.${name}`;
    if (!eventNames.has(name)) {
      fail('E_UNKNOWN_EVENT', `rules.on has a handler for "${name}" but no event with that name is scheduled`, path,
        eventNames.size ? 'events: ' + [...eventNames].join(', ') : 'add it to "events"');
      continue;
    }
    const fn = attempt(() => compileProgramSource(codeText(code), path, ruleBase(['t', 'dt', 'tick', 'pi', 'seq', 'batch'])));
    if (fn) rules.on.set(name, fn);
  }

  for (const name of emits) {
    if (eventNames.has(name)) fail('E_EMIT_NAME', `emit('${name}') reuses the name of a scheduled event, so "whenever ${name}" would be ambiguous; pick another emit name`, 'rules');
  }
  const signalNames = new Set([...eventNames, ...emits]);

  // ---- layout and parts ------------------------------------------------------
  const layout = { cols: (spec.layout && spec.layout.cols) || 12, rows: (spec.layout && spec.layout.rows) || 8 };
  const partIds = new Set();
  const parts = [];
  (spec.parts || []).forEach((p, i) => {
    const path = `parts.${p.id || i}`;
    if (typeof p.id !== 'string' || !/^[A-Za-z_][A-Za-z0-9_-]{0,39}$/.test(p.id) || p.id.startsWith('__')) { fail('E_NAME', `part id "${p.id}" must use letters, digits, "-" and "_", and not start with "__"`, `parts[${i}].id`); return; }
    if (partIds.has(p.id)) { fail('E_DUPLICATE_NAME', `two parts are called "${p.id}"`, path); return; }
    partIds.add(p.id);
    if (!PART_TYPES.includes(p.type)) { fail('E_PART_TYPE', `part "${p.id}" has unknown type "${p.type}"`, path + '.type', 'types: ' + PART_TYPES.join(', ')); return; }
    if (p.type !== 'link') {
      const at = p.at;
      if (!Array.isArray(at) || at.length !== 4 || !at.every((x) => Number.isInteger(x))) {
        fail('E_LAYOUT', `part "${p.id}" needs "at": [col, row, width, height] in whole grid cells`, path + '.at');
        return;
      }
      const [c, r, w, h] = at;
      if (c < 0 || r < 0 || w < 1 || h < 1 || c + w > layout.cols || r + h > layout.rows) {
        fail('E_LAYOUT_BOUNDS', `part "${p.id}" at [${at.join(', ')}] does not fit the ${layout.cols}×${layout.rows} grid`, path + '.at');
      }
    }
    const bind = (key, kind) => {
      const v = p[key];
      if (v == null) return null;
      const bp = `${path}.${key}`;
      if (kind === 'template') return attempt(() => compileTemplate(String(v), bp, exprBase('a caption or label')));
      if (typeof v === 'number' || typeof v === 'boolean') { const c = v; return () => c; }
      return attempt(() => compileExpressionSource(String(v), bp, exprBase('a part binding')));
    };
    const tone = (key) => {
      const v = p[key];
      if (v == null) return null;
      if (typeof v === 'string' && (TONES.includes(v) || /^#[0-9a-fA-F]{6}$/.test(v))) { const c = v; return () => c; }
      if (typeof v === 'object' && !Array.isArray(v)) return null; // handled per type (link tone maps)
      return bind(key, 'expr');
    };
    const cp = {
      id: p.id, type: p.type, at: p.at, label: p.label != null ? String(p.label) : null, spec: p,
      expect: (p.type === 'counter' || p.type === 'gauge' || p.type === 'tank') ? bind('expect') : null,
      visible: bind('visible'), highlight: bind('highlight'), tone: tone('tone'),
      pulse: p.pulse == null ? [] : (Array.isArray(p.pulse) ? p.pulse : [p.pulse]),
    };
    for (const name of cp.pulse) {
      if (!signalNames.has(name)) fail('E_UNKNOWN_SIGNAL', `part "${p.id}" pulses on "${name}", which is never emitted and is not an event`, path + '.pulse', hintNames(signalNames));
    }
    switch (p.type) {
      case 'box': cp.text = bind('text', 'template'); break;
      case 'tank': cp.level = need(bind('level'), 'level'); cp.text = bind('text', 'template'); break;
      case 'queue': case 'stack':
        cp.items = need(bind('items'), 'items'); cp.slots = bind('slots'); cp.showValues = p.showValues !== false; break;
      case 'grid':
        cp.cells = need(bind('cells'), 'cells'); cp.mark = bind('mark');
        cp.cols = p.cols || null; cp.tones = p.tones || null; cp.showValues = p.showValues !== false; break;
      case 'counter': cp.value = need(bind('value'), 'value'); cp.format = p.format || null; cp.unit = p.unit || ''; break;
      case 'gauge':
        cp.value = need(bind('value'), 'value'); cp.min = bind('min') || (() => 0); cp.max = need(bind('max'), 'max');
        cp.format = p.format || null; cp.unit = p.unit || ''; cp.zones = p.zones || []; break;
      case 'lamp': cp.on = need(bind('on'), 'on'); cp.text = bind('text', 'template'); break;
      case 'node':
        cp.state = need(bind('state'), 'state');
        cp.states = Array.isArray(p.states) ? p.states.map((s) => (typeof s === 'string' ? { id: s, label: s } : s)) : [];
        if (!cp.states.length) fail('E_PART', `node "${p.id}" needs a "states" list`, path + '.states');
        break;
      case 'link': {
        if (!p.from || !p.to) fail('E_PART', `link "${p.id}" needs "from" and "to"`, path);
        cp.from = p.from; cp.to = p.to; cp.via = p.via || [];
        cp.on = p.on == null ? [] : (Array.isArray(p.on) ? p.on : [p.on]);
        cp.toneMap = p.tone && typeof p.tone === 'object' && !Array.isArray(p.tone) ? p.tone : null;
        cp.travel = p.travel || null;
        cp.active = bind('active');
        if (p.after != null && !(spec.parts || []).some((q) => q.id === p.after && q.type === 'link')) fail('E_UNKNOWN_PART', `link "${p.id}" follows "${p.after}", which is not a link`, path + '.after');
        for (const name of cp.on) {
          if (!signalNames.has(name)) fail('E_UNKNOWN_SIGNAL', `link "${p.id}" listens for "${name}", which is never emitted and is not an event`, path + '.on', hintNames(signalNames));
        }
        break;
      }
      case 'chart': {
        const series = Array.isArray(p.series) ? p.series : [];
        if (!series.length) fail('E_PART', `chart "${p.id}" needs at least one series`, path + '.series');
        cp.series = series.map((s, j) => {
          const sp = `${path}.series[${j}]`;
          const src = typeof s === 'string' ? s : s.expr;
          const fn = attempt(() => compileExpressionSource(String(src), sp, exprBase('a chart series')));
          return { fn, label: (s && s.label) || String(src), tone: (s && s.tone) || null };
        });
        cp.y = Array.isArray(p.y) ? p.y.map((v, j) => (typeof v === 'number' ? () => v : attempt(() => compileExpressionSource(String(v), `${path}.y[${j}]`, paramOnly('a chart axis'))))) : null;
        cp.refs = (p.refs || []).map((r, j) => ({
          fn: typeof r.y === 'number' ? (() => r.y) : attempt(() => compileExpressionSource(String(r.y), `${path}.refs[${j}].y`, exprBase('a chart reference line'))),
          label: r.label || '', tone: r.tone || 'muted',
        }));
        cp.step = !!p.step;
        break;
      }
      case 'label': cp.text = need(bind('text', 'template'), 'text'); cp.align = p.align || 'center'; cp.size = p.size || 'm'; break;
      case 'group': break;
      default: break;
    }
    parts.push(cp);
    function need(v, key) {
      if (v == null && p[key] == null) fail('E_PART', `${p.type} "${p.id}" needs "${key}"`, `${path}.${key}`);
      return v;
    }
  });
  for (const cp of parts) {
    if (cp.type === 'link') {
      for (const end of ['from', 'to']) {
        const target = cp[end];
        if (target && !partIds.has(target)) fail('E_UNKNOWN_PART', `link "${cp.id}" ${end} "${target}" is not a part`, `parts.${cp.id}.${end}`);
        else if (target && parts.find((q) => q.id === target && q.type === 'link')) fail('E_UNKNOWN_PART', `link "${cp.id}" cannot attach to another link`, `parts.${cp.id}.${end}`);
      }
    }
  }
  // static overlap check: solid parts may not share grid cells (groups may contain them)
  const solid = parts.filter((p) => p.type !== 'link' && p.type !== 'group' && Array.isArray(p.at));
  for (let i = 0; i < solid.length; i++) {
    for (let j = i + 1; j < solid.length; j++) {
      if (rectsOverlap(solid[i].at, solid[j].at)) {
        fail('E_LAYOUT_OVERLAP', `parts "${solid[i].id}" and "${solid[j].id}" overlap on the grid`, `parts.${solid[j].id}.at`);
      }
    }
  }

  // ---- narration ---------------------------------------------------------------
  const narration = [];
  (spec.narration || []).forEach((n, i) => {
    const path = `narration[${i}]`;
    const text = attempt(() => compileTemplate(String(n.text), path + '.text', exprBase('a caption')));
    const from = typeof n.from === 'number' ? n.from : 0;
    const to = typeof n.to === 'number' ? n.to : null;
    narration.push({ index: i, from, to, text, raw: String(n.text), cites: Array.isArray(n.cites) ? n.cites : [], path });
  });
  narration.sort((a, b) => a.from - b.from);
  narration.forEach((n, i) => { if (n.to == null) n.to = i + 1 < narration.length ? narration[i + 1].from : duration; });

  // ---- claims ----------------------------------------------------------------
  const claimIds = new Set();
  const claims = [];
  (spec.claims || []).forEach((c, i) => {
    const path = `claims.${c.id || i}`;
    if (typeof c.id !== 'string' || !/^[A-Za-z_][A-Za-z0-9_-]{0,59}$/.test(c.id) || c.id.startsWith('__')) { fail('E_NAME', `claim id "${c.id}" must use letters, digits, "-" and "_", and not start with "__"`, `claims[${i}].id`); return; }
    if (claimIds.has(c.id)) { fail('E_DUPLICATE_NAME', `two claims are called "${c.id}"`, path); return; }
    claimIds.add(c.id);
    const text = attempt(() => compileTemplate(String(c.text || ''), path + '.text', paramOnly('claim text')));
    const cc = attempt(() => compileClaim(c, path, false));
    if (cc) { cc.id = c.id; cc.text = text; cc.raw = String(c.text || ''); cc.index = i; claims.push(cc); }
  });
  for (const n of narration) {
    n.cites.forEach((id, j) => {
      if (!claimIds.has(id)) fail('E_UNKNOWN_CLAIM', `caption cites claim "${id}", which does not exist`, `${n.path}.cites[${j}]`, hintNames(claimIds));
    });
  }

  function timeValue(v, path) {
    if (v == null) return null;
    if (typeof v === 'number') return () => v;
    const f = compileExpressionSource(String(v), path, paramOnly('a claim time'));
    return f;
  }

  function compileClaim(c, path, inner) {
    if (!CLAIM_KINDS.includes(c.kind)) throw new ModelError('E_CLAIM_KIND', `claim kind "${c.kind}" is not one of ${CLAIM_KINDS.join(', ')}`, { path: path + '.kind' });
    const out = { kind: c.kind, path };
    const expr = (key, base) => {
      if (c[key] == null) throw new ModelError('E_CLAIM', `${c.kind} claim needs "${key}"`, { path: `${path}.${key}` });
      return compileExpressionSource(String(c[key]), `${path}.${key}`, base);
    };
    switch (c.kind) {
      case 'at':
        if (c.t == null) throw new ModelError('E_CLAIM', 'an "at" claim needs "t"', { path: path + '.t' });
        out.t = timeValue(c.t, path + '.t');
        out.expr = expr('expr', exprBase('a claim'));
        break;
      case 'always':
      case 'never':
        out.expr = expr('expr', exprBase('a claim'));
        out.from = timeValue(c.from, path + '.from');
        out.until = timeValue(c.until, path + '.until');
        break;
      case 'eventually':
        out.expr = expr('expr', exprBase('a claim'));
        out.from = timeValue(c.from, path + '.from');
        out.by = timeValue(c.by, path + '.by');
        break;
      case 'whenever': {
        if (typeof c.event !== 'string') throw new ModelError('E_CLAIM', 'a "whenever" claim needs "event"', { path: path + '.event' });
        if (!signalNames.has(c.event)) {
          const e = new ModelError('E_UNKNOWN_SIGNAL', `whenever claim watches "${c.event}", which is never emitted and is not an event`, { path: path + '.event' });
          e.hint = hintNames(signalNames);
          throw e;
        }
        out.event = c.event;
        out.scheduled = eventNames.has(c.event);
        const imp = ['t', 'dt', 'tick', 'pi', 'payload'];
        if (out.scheduled) imp.push('seq', 'batch');
        out.expr = expr('expr', { ...exprBase('a claim'), implicit: new Set(imp) });
        out.within = timeValue(c.within, path + '.within');
        if (out.within) out.expr = expr('expr', exprBase('a claim')); // checked on later snapshots: no payload
        break;
      }
      case 'sweep': {
        if (inner) throw new ModelError('E_CLAIM', 'a sweep cannot contain another sweep or a compare', { path });
        if (!c.claim || typeof c.claim !== 'object') throw new ModelError('E_CLAIM', 'a sweep needs an inner "claim"', { path: path + '.claim' });
        if (c.claim.kind === 'sweep' || c.claim.kind === 'compare') throw new ModelError('E_CLAIM', 'a sweep cannot contain another sweep or a compare', { path: path + '.claim.kind' });
        out.inner = compileClaim(c.claim, path + '.claim', true);
        out.samples = Math.max(2, Math.min(400, c.samples || 24));
        const vary = c.vary == null ? params.map((p) => p.id) : c.vary;
        out.vary = [];
        const entries = Array.isArray(vary) ? vary.map((id) => [id, null]) : Object.entries(vary);
        for (const [id, range] of entries) {
          const p = params.find((q) => q.id === id);
          if (!p) throw new ModelError('E_UNKNOWN_PARAM', `sweep varies "${id}", which is not a param`, { path: path + '.vary' });
          const lo = range ? range[0] : p.min;
          const hi = range ? range[1] : p.max;
          if (!(hi >= lo)) throw new ModelError('E_PARAM_RANGE', `sweep range for "${id}" is empty`, { path: path + '.vary' });
