          out.vary.push({ id, lo, hi, step: p.step, min: p.min });
        }
        if (!out.vary.length) throw new ModelError('E_CLAIM', 'a sweep needs at least one param to vary', { path: path + '.vary' });
        out.holdsWhen = c.holdsWhen != null ? expr('holdsWhen', exprBase('holdsWhen')) : null;
        out.seed = c.seed != null ? c.seed : null;
        break;
      }
      case 'compare': {
        if (inner) throw new ModelError('E_CLAIM', 'a sweep cannot contain a compare', { path });
        const runs = {};
        for (const side of ['a', 'b']) {
          const o = c[side];
          if (!o || typeof o !== 'object' || Array.isArray(o)) throw new ModelError('E_CLAIM', `a compare claim needs "${side}": an object of param overrides`, { path: `${path}.${side}` });
          runs[side] = Object.entries(o).map(([id, v]) => {
            if (!paramIds.has(id)) throw new ModelError('E_UNKNOWN_PARAM', `compare "${side}" sets "${id}", which is not a param`, { path: `${path}.${side}.${id}` });
            const fn = typeof v === 'number' ? (() => v) : compileExpressionSource(String(v), `${path}.${side}.${id}`, paramOnly('a compare override'));
            return { id, fn, raw: v };
          });
        }
        out.runs = runs;
        const m = c.measure;
        if (!m || typeof m !== 'object' || m.of == null) throw new ModelError('E_CLAIM', 'a compare claim needs "measure": { "of": expr, "agg": "max" }', { path: path + '.measure' });
        const agg = m.agg || 'max';
        if (!AGGS.includes(agg)) throw new ModelError('E_CLAIM', `measure.agg must be one of ${AGGS.join(', ')}`, { path: path + '.measure.agg' });
        out.measure = {
          of: compileExpressionSource(String(m.of), path + '.measure.of', exprBase('a measure')),
          agg, raw: String(m.of),
          t: agg === 'at' ? timeValue(m.t, path + '.measure.t') : null,
          label: m.label || null,
        };
        if (agg === 'at' && !out.measure.t) throw new ModelError('E_CLAIM', 'measure.agg "at" needs "t"', { path: path + '.measure.t' });
        const get = (k) => (env) => env.cmp[k];
        out.expect = expr('expect', { params: paramIds, implicit: new Set(['pi']), extra: new Map([['a', get('a')], ['b', get('b')]]), what: 'a compare expectation' });
        break;
      }
      default: break;
    }
    return out;
  }

  const summary = spec.summary != null ? attempt(() => compileTemplate(String(spec.summary), 'summary', paramOnly('the summary'))) : null;

  const model = {
    spec, title: spec.title || 'Untitled model', summary, timeUnit: spec.timeUnit || 's',
    dt, duration, K, seed: spec.seed != null ? spec.seed : 1,
    maxSteps: (spec.limits && spec.limits.steps) || null,
    params, paramIds, stateNames, stateInit, derived, derivedGetters,
    events, eventNames, emits, signalNames, rules, layout, parts, narration, claims,
    playback: spec.playback || {},
  };
  return { model, errors, warnings };
}

function warn(code, message, path) { return { code, severity: 'warning', message, path }; }

function hintNames(set) {
  const xs = [...set];
  return xs.length ? 'known: ' + xs.join(', ') : 'nothing is emitted yet; call emit(\'name\') in a rule';
}

function validLiteral(v) {
  const k = kindOf(v);
  if (k === 'invalid') return false;
  if (k === 'list') return v.length <= 10000 && v.every(validLiteral);
  return true;
}

function rectsOverlap(a, b) {
  return a[0] < b[0] + b[2] && b[0] < a[0] + a[2] && a[1] < b[1] + b[3] && b[1] < a[1] + a[3];
}

function niceStep(min, max) {
  const span = max - min;
  if (!(span > 0)) return 1;
  const raw = span / 100;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  return mag;
}

// Snap a value to a param's step grid and remove float noise (0.30000000000000004 -> 0.3).
function snapToStep(v, p) {
  const steps = Math.round((v - p.min) / p.step);
  const x = p.min + steps * p.step;
  const decimals = Math.min(10, Math.max(decimalsOf(p.step), decimalsOf(p.min)));
  const y = Number(x.toFixed(decimals));
  return Math.min(p.max, Math.max(p.min, y));
}

function decimalsOf(x) {
  const s = String(x);
  if (s.includes('e-')) return Number(s.split('e-')[1]);
  const i = s.indexOf('.');
  return i < 0 ? 0 : s.length - i - 1;
}

// ---- simulate.mjs ----
// Discrete-time simulation.
//
// Tick 0: state starts from its initial values, rules.init runs, then events
//         scheduled at t = 0 fire. Snapshot 0 is taken.
// Tick k: t = k * dt. rules.tick runs, then every event whose time falls in
//         (t - dt, t] fires (in spec order; a burst of n runs the handler n
//         times with batch = 0..n-1). Snapshot k is taken.
//
// The trace keeps a deep copy of the state at every tick, every emit() with
// its tick, and every event firing, so the page can scrub through time and
// claims can be checked after the run.



// Every event entry, burst and random arrival counts towards one cap, so a
// spec such as "count": 1e9 or "rate": 1e12 fails at once instead of hanging.
const MAX_FIRINGS = 200000;

function tooManyFirings(path) {
  return new ModelError('E_EVENT', `the events add up to more than ${MAX_FIRINGS} firings in one run; use a smaller count or rate, or a larger "every"`, { path });
}

function resolveParams(model, overrides) {
  const P = Object.create(null);
  for (const p of model.params) {
    let v = overrides && overrides[p.id] != null ? Number(overrides[p.id]) : p.default;
    if (!Number.isFinite(v)) v = p.default;
    P[p.id] = v;
  }
  return P;
}

function makeEnv(model, P, rng) {
  return {
    S: Object.create(null), P, L: [], t: 0, dt: model.dt, tick: 0,
    seq: 0, batch: 0, payload: null, rng,
    steps: 0, maxSteps: model.maxSteps || LIMITS.steps,
    kinds: Object.create(null), emit: null, cmp: null,
  };
}

function tickOf(time, dt) {
  return Math.max(0, Math.ceil(time / dt - 1e-9));
}

function evalParamExpr(fn, env, what, path) {
  const v = fn(env);
  if (typeof v !== 'number' || !Number.isFinite(v)) {
    throw new ModelError('E_EVENT', `${what} must be a finite number, got ${String(v)}`, { path });
  }
  return v;
}

// Build the per-tick schedule of deterministic events.
function schedule(model, env) {
  const K = model.K;
  const byTick = new Map();
  const add = (k, ev, count) => {
    if (k > K || count <= 0) return;
    let list = byTick.get(k);
    if (!list) { list = []; byTick.set(k, list); }
    const last = list.length ? list[list.length - 1] : null;
    if (last && last.ev === ev) last.count += count;
    else list.push({ ev, count });
  };
  let total = 0;
  const poissonEvents = [];
  for (const ev of model.events) {
    const count = Math.round(evalParamExpr(ev.count, env, `event "${ev.name}" count`, ev.path + '.count'));
    if (count < 0) throw new ModelError('E_EVENT', `event "${ev.name}" count is negative`, { path: ev.path + '.count' });
    const from = ev.from ? evalParamExpr(ev.from, env, `event "${ev.name}" from`, ev.path + '.from') : 0;
    const until = ev.until ? evalParamExpr(ev.until, env, `event "${ev.name}" until`, ev.path + '.until') : model.duration;
    if (ev.mode === 'at') {
      const times = ev.atList ? ev.atList : [evalParamExpr(ev.at, env, `event "${ev.name}" at`, ev.path + '.at')];
      for (const time of times) {
        if (time < 0 || time > model.duration + 1e-9) continue;
        add(tickOf(time, model.dt), ev, count);
        total += count;
        if (total > MAX_FIRINGS) throw tooManyFirings(ev.path + (ev.atList ? '.at' : '.count'));
      }
    } else if (ev.mode === 'every') {
      const period = evalParamExpr(ev.every, env, `event "${ev.name}" every`, ev.path + '.every');
      if (!(period > 0)) throw new ModelError('E_EVENT', `event "${ev.name}" "every" must be positive, got ${period}`, { path: ev.path + '.every' });
      for (let i = 0; ; i++) {
        const time = from + i * period;
        if (time > until + 1e-9 || time > model.duration + 1e-9) break;
        add(tickOf(time, model.dt), ev, count);
        total += count;
        if (total > MAX_FIRINGS) throw tooManyFirings(ev.path + '.every');
      }
    } else {
      const rate = evalParamExpr(ev.rate, env, `event "${ev.name}" rate`, ev.path + '.rate');
      if (rate < 0) throw new ModelError('E_EVENT', `event "${ev.name}" rate is negative`, { path: ev.path + '.rate' });
      poissonEvents.push({ ev, rate, from, until, count });
    }
  }
  return { byTick, poissonEvents, total };
}

// observers: [{ names: Set, onFire(env, info) }] called after each handler or
// tick-rule block for the event it ran and each name it emitted.
// onSnapshot(env, k) is called after each snapshot.
function simulate(model, overrides, opts = {}) {
  const P = resolveParams(model, overrides);
  const rng = makeRng(model.seed);
  const env = makeEnv(model, P, rng);
  const K = model.K;
  const dt = model.dt;
  const snaps = new Array(K + 1);
  const emits = new Array(K + 1);
  const fired = new Array(K + 1);
  const observers = opts.observers || [];
  const watch = new Set();
  for (const o of observers) for (const n of o.names) watch.add(n);
  const trace = { model, params: P, K, dt, snaps, emits, fired, error: null, steps: 0 };
  // opts.budget is shared by every run of one claim check, so many sweep
  // samples or compares cannot add up to minutes of work. Ticks count too.
  const budget = opts.budget || null;
  const ownLimit = env.maxSteps;
  // a tick (snapshot, schedule, observers) costs about as much as 32 rule steps
  const tickCost = 32 * K;
  if (budget) env.maxSteps = Math.min(ownLimit, budget.left - tickCost);

  let block = null; // emits of the block currently running
  env.emit = (name, payload) => {
    const rec = { name, payload, src: env.__src, batch: env.batch };
    emits[env.tick].push(rec);
    if (block) block.push(rec);
  };

  const runBlock = (fn, srcName) => {
    block = [];
    env.__src = srcName;
    if (fn) fn(env);
    const done = block;
    block = null;
    if (watch.size) {
      if (srcName && watch.has(srcName)) notify(srcName, null, true);
      for (const e of done) if (watch.has(e.name)) notify(e.name, e.payload, false);
    }
  };
  const notify = (name, payload, scheduled) => {
    const saved = env.payload;
    env.payload = payload;
    for (const o of observers) if (o.names.has(name)) o.onFire(env, { name, payload, scheduled, k: env.tick, t: env.t });
    env.payload = saved;
  };

  // The trace stores a copy of the state at every tick; LIMITS.traceCells
  // caps the total so a big list in a long run fails cleanly instead of
  // running Node or the browser out of memory.
  let stored = 0;
  const snapshot = (k) => {
    const s = Object.create(null);
    const box = { n: 0, over: null };
    for (const name of model.stateNames) {
      const v = env.S[name];
      box.n += 1;
      const c = Array.isArray(v) ? copyBounded(v, box, LIMITS.traceCells - stored) : v;
      if (c === undefined || stored + box.n > LIMITS.traceCells) {
        if (box.over === 'depth') throw new ModelError('E_TOO_DEEP', `state "${name}" is a list nested more than ${LIMITS.depth} levels deep`, { path: 'state.' + name });
        throw new ModelError('E_TRACE_LIMIT', `the run would store more than ${LIMITS.traceCells} values (the whole state is kept for each of the ${K + 1} ticks); use a larger dt, a shorter duration or smaller lists`, { path: 'state.' + name });
      }
      s[name] = c;
    }
    stored += box.n;
    snaps[k] = s;
    if (opts.onSnapshot) opts.onSnapshot(env, k);
  };

  try {
    if (budget && env.maxSteps <= 0) throw budgetError(budget, 0, null);
    // initial state
    for (const si of model.stateInit) {
      const box = { n: 0, over: null };
      const v = copyBounded(si.fn ? si.fn(env) : si.value, box, LIMITS.cells);
      if (v === undefined) throw new ModelError(box.over === 'depth' ? 'E_TOO_DEEP' : 'E_LIST_LIMIT', `state "${si.name}" starts as a list that is too big or too deeply nested`, { path: 'state.' + si.name });
      const kind = kindOf(v);
      if (kind === 'number' && !Number.isFinite(v)) throw new ModelError('E_NONFINITE', `state "${si.name}" starts as a non-finite number`, { path: 'state.' + si.name });
      env.S[si.name] = v;
      env.kinds[si.name] = kind;
    }
    for (let k = 0; k <= K; k++) { emits[k] = []; fired[k] = []; }
    const { byTick, poissonEvents, total } = schedule(model, env);
    let firings = total;
    const seqs = Object.create(null);

    const fire = (ev, count) => {
      const handler = model.rules.on.get(ev.name);
      fired[env.tick].push({ name: ev.name, count });
      for (let b = 0; b < count; b++) {
        env.seq = seqs[ev.name] || 0;
        seqs[ev.name] = env.seq + 1;
        env.batch = b;
        runBlock(handler || null, ev.name);
      }
      env.seq = 0;
      env.batch = 0;
    };

    env.t = 0;
    env.tick = 0;
    if (model.rules.init) runBlock(model.rules.init, null);
    for (const item of byTick.get(0) || []) fire(item.ev, item.count);
    snapshot(0);

    for (let k = 1; k <= K; k++) {
      env.tick = k;
      env.t = k * dt;
      if (model.rules.tick) runBlock(model.rules.tick, null);
      const sched = byTick.get(k) || [];
      // deterministic and random events fire in spec order
      let si = 0;
      for (const ev of model.events) {
        if (ev.mode === 'rate') {
          const pe = poissonEvents.find((x) => x.ev === ev);
          if (env.t > pe.from + 1e-9 && env.t <= pe.until + 1e-9) {
            const n = poisson(rng, pe.rate * dt) * pe.count;
            firings += n;
            if (firings > MAX_FIRINGS) throw tooManyFirings(ev.path + '.rate');
            if (n > 0) fire(ev, n);
          }
          continue;
        }
        while (si < sched.length && sched[si].ev === ev) { fire(ev, sched[si].count); si++; }
      }
      snapshot(k);
    }
  } catch (err) {
    if (!(err instanceof ModelError)) throw err;
    let e = err;
    if (budget && e.code === 'E_STEP_LIMIT' && env.maxSteps < ownLimit) e = budgetError(budget, env.tick, e.loc);
    e.at = { t: env.t, tick: env.tick };
    trace.error = e;
    trace.K = Math.max(0, snaps.findIndex((s) => s === undefined) - 1);
    if (trace.K < 0) trace.K = 0;
  }
  trace.steps = env.steps;
  if (budget) budget.left -= env.steps + tickCost;
  return trace;
}

function makeBudget(steps) {
  const n = steps || LIMITS.checkSteps;
  return { total: n, left: n };
}

function budgetError(budget, tick, loc) {
  return new ModelError('E_STEP_LIMIT', `checking the claims needs more than ${budget.total} steps of simulation in all (each sweep sample and each compare run re-runs the model); use fewer sweep samples, a shorter run or lighter rules`, loc);
}

// Environment for evaluating expressions against a recorded snapshot.
function snapshotEnv(trace, k) {
  const model = trace.model;
  return {
    S: trace.snaps[k], P: trace.params, L: [], t: k * model.dt, dt: model.dt, tick: k,
    seq: 0, batch: 0, payload: null, rng: () => 0, steps: 0, maxSteps: 1e6, kinds: null, emit: null, cmp: null,
  };
}

// Current values of state and derived names for display.
function valuesAt(trace, k, names) {
  const env = snapshotEnv(trace, k);
  const model = trace.model;
  const out = {};
  for (const name of names) {
    if (model.stateNames.includes(name)) out[name] = env.S[name];
    else if (model.derivedGetters.has(name)) {
      try { out[name] = model.derivedGetters.get(name)(env); } catch { out[name] = null; }
    } else if (model.paramIds.has(name)) out[name] = trace.params[name];
  }
  return out;
}

// ---- claims.mjs ----
// Claim checking. Every claim becomes a test against one or more simulated
// runs, and a failing claim carries its first counterexample: the time, the
// values it depends on, and the params of the run.






const EPS = 1e-9;

function paramEnv(model, P) {
  return { S: Object.create(null), P, L: [], t: 0, dt: model.dt, tick: 0, seq: 0, batch: 0, payload: null, rng: () => 0, steps: 0, maxSteps: 1e6, kinds: null, emit: null, cmp: null };
}

function timeOf(fn, model, P, path) {
  const v = fn(paramEnv(model, P));
  if (typeof v !== 'number' || !Number.isFinite(v)) throw new ModelError('E_CLAIM_TIME', `a claim time must be a number, got ${String(v)}`, { path });
  return v;
}

function tickAt(model, time, path, mode) {
  const x = time / model.dt;
  const k = mode === 'floor' ? Math.floor(x + EPS) : mode === 'ceil' ? Math.ceil(x - EPS) : Math.round(x);
  if (k < 0 || k > model.K) throw new ModelError('E_CLAIM_TIME', `time ${autoNumber(time)} is outside the run (0 to ${autoNumber(model.duration)})`, { path });
  return k;
}

function asBool(v, claim) {
  if (typeof v !== 'boolean') {
    throw new ModelError('E_CLAIM_NOT_BOOLEAN', `the claim expression must be true or false, got ${kindOf(v)} ${formatValue(v)}`, { path: claim.path + '.expr' });
  }
  return v;
}

// Values of the state, derived and param names an expression refers to.
function refValues(model, env, refs) {
  const out = {};
  if (!refs) return out;
  for (const name of refs) {
    if (model.stateNames.includes(name)) out[name] = deepCopy(env.S[name]);
    else if (model.derivedGetters.has(name)) {
      try { out[name] = model.derivedGetters.get(name)(env); } catch { out[name] = null; }
    } else if (model.paramIds.has(name)) out[name] = env.P[name];
  }
  return out;
}

function counterexample(model, env, refs, extra) {
  return Object.assign({ t: env.t, tick: env.tick, values: refValues(model, env, refs), params: { ...env.P } }, extra || {});
}

// ---- watchers: whenever claims need to look at the run while it happens ----

function makeWatcher(model, claim, P) {
  const st = { fired: 0, failed: null, pending: [], inconclusive: 0, error: null };
  const within = claim.within ? timeOf(claim.within, model, P, claim.path + '.within') : null;
  const observer = {
    names: new Set([claim.event]),
    onFire(env, info) {
      if (st.failed || st.error) return;
      st.fired++;
      if (within == null) {
        try {
          const ok = asBool(claim.expr(env), claim);
          if (!ok) {
            st.failed = counterexample(model, env, claim.expr.refs, { event: info.name, payload: deepCopy(info.payload) });
          }
        } catch (e) { if (e instanceof ModelError) st.error = e; else throw e; }
      } else {
        st.pending.push({ firedAt: env.t, deadline: env.t + within, payload: deepCopy(info.payload) });
      }
    },
  };
  const onSnapshot = (env) => {
    if (within == null || st.failed || st.error || !st.pending.length) return;
    let ok;
    try { ok = asBool(claim.expr(env), claim); } catch (e) { if (e instanceof ModelError) { st.error = e; return; } throw e; }
    if (ok) { st.pending = []; return; }
    const late = st.pending.find((p) => env.t >= p.deadline - EPS);
    if (late) {
      st.failed = counterexample(model, env, claim.expr.refs, { event: claim.event, firedAt: late.firedAt, deadline: late.deadline });
    }
  };
  const finish = () => {
    if (st.error) return { pass: false, status: 'error', error: st.error };
    if (st.failed) return { pass: false, status: 'fail', counterexample: st.failed, stats: { fired: st.fired } };
    const open = st.pending.filter((p) => p.deadline > model.duration + EPS).length;
    return { pass: true, status: 'pass', stats: { fired: st.fired, unresolved: open } };
  };
  return { observer, onSnapshot, finish };
}

// Run one simulation and evaluate the given (non-sweep, non-compare) claims on it.
function evaluateOnRun(model, overrides, claims, opts = {}) {
  const P = resolveParams(model, overrides);
  const watchers = new Map();
  const observers = [];
  const snapHooks = [];
  const early = new Map();
  for (const c of claims) {
    if (c.kind !== 'whenever') continue;
    try {
      const w = makeWatcher(model, c, P);
      watchers.set(c, w);
      observers.push(w.observer);
      snapHooks.push(w.onSnapshot);
    } catch (e) {
      if (e instanceof ModelError) early.set(c, { pass: false, status: 'error', error: e });
      else throw e;
    }
  }
  const trace = opts.trace && !observers.length ? opts.trace : simulate(model, overrides, {
    budget: opts.budget,
    observers,
    onSnapshot: snapHooks.length ? (env, k) => { for (const h of snapHooks) h(env, k); } : null,
  });
  const results = new Map();
  for (const c of claims) {
    if (early.has(c)) { results.set(c, early.get(c)); continue; }
    if (trace.error) { results.set(c, { pass: false, status: 'error', error: trace.error }); continue; }
    try {
      results.set(c, watchers.has(c) ? watchers.get(c).finish() : evaluateOnTrace(model, trace, c));
    } catch (e) {
      if (e instanceof ModelError) results.set(c, { pass: false, status: 'error', error: e });
      else throw e;
    }
  }
  return { trace, results };
}

function evaluateOnTrace(model, trace, c) {
  const P = trace.params;
  const K = trace.K;
  switch (c.kind) {
    case 'at': {
      const time = timeOf(c.t, model, P, c.path + '.t');
      const k = tickAt(model, time, c.path + '.t', 'round');
      const env = snapshotEnv(trace, k);
      const ok = asBool(c.expr(env), c);
      return ok ? { pass: true, status: 'pass', stats: { t: env.t } } : { pass: false, status: 'fail', counterexample: counterexample(model, env, c.expr.refs) };
    }
    case 'always':
    case 'never': {
      const k0 = c.from ? tickAt(model, timeOf(c.from, model, P, c.path + '.from'), c.path + '.from', 'ceil') : 0;
      const k1 = c.until ? tickAt(model, timeOf(c.until, model, P, c.path + '.until'), c.path + '.until', 'floor') : K;
      const want = c.kind === 'always';
      for (let k = k0; k <= k1; k++) {
        const env = snapshotEnv(trace, k);
        if (asBool(c.expr(env), c) !== want) {
          return { pass: false, status: 'fail', counterexample: counterexample(model, env, c.expr.refs) };
        }
      }
      return { pass: true, status: 'pass', stats: { ticks: Math.max(0, k1 - k0 + 1) } };
    }
    case 'eventually': {
      const k0 = c.from ? tickAt(model, timeOf(c.from, model, P, c.path + '.from'), c.path + '.from', 'ceil') : 0;
      const k1 = c.by ? tickAt(model, timeOf(c.by, model, P, c.path + '.by'), c.path + '.by', 'floor') : K;
      for (let k = k0; k <= k1; k++) {
        const env = snapshotEnv(trace, k);
        if (asBool(c.expr(env), c)) return { pass: true, status: 'pass', stats: { at: env.t } };
      }
      const env = snapshotEnv(trace, Math.max(k0, k1));
      return { pass: false, status: 'fail', counterexample: counterexample(model, env, c.expr.refs, { deadline: true }) };
    }

      throw new ModelError('E_CLAIM_KIND', `cannot evaluate a ${c.kind} claim on a single run`, { path: c.path });

}

// ---- sweep ------------------------------------------------------------------

function sweepSamples(model, claim, base) {
  const seed = claim.seed != null ? claim.seed : `${hashSeed(model.seed)}:${claim.id || claim.path}`;
  const rng = makeRng(seed);
  const n = claim.samples;
  const perms = claim.vary.map(() => {
    const a = [];
    for (let i = 0; i < n; i++) a.push(i);
    for (let i = n - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  });
  const out = [];
  for (let i = 0; i < n; i++) {
    const s = { ...base };
    claim.vary.forEach((v, d) => {
      const u = (perms[d][i] + rng()) / n;
      const p = model.params.find((q) => q.id === v.id);
      s[v.id] = snapToStep(v.lo + u * (v.hi - v.lo), { ...p, min: p.min, max: p.max });
      s[v.id] = Math.min(v.hi, Math.max(v.lo, s[v.id]));

}

function evaluateSweep(model, c, P, budget) {
  const samples = sweepSamples(model, c, { ...P });

    if (c.holdsWhen) {
      try { holds = asBool(c.holdsWhen(snapshotEnv(trace, 0)), { path: c.path + '.holdsWhen' }); } catch (e) {

      }

    if (holds) {
      inside++;
      if (!r.pass) return { pass: false, status: 'fail', counterexample: { ...r.counterexample, sample: pick(s), params: s, note: c.holdsWhen ? 'inside' : 'sample' }, stats: { samples: samples.length } };

      outside++;

    return { pass: false, status: 'fail', counterexample: { t: null, values: {}, params: { ...P }, note: inside === 0 ? 'none-inside' : 'none-outside' }, stats: { samples: samples.length, inside, outside } };

}

// ---- compare ----------------------------------------------------------------

function measureRun(model, trace, m) {
  if (trace.error) throw trace.error;
  const K = trace.K;
  const val = (k) => {
    const v = m.of(snapshotEnv(trace, k));
    if (typeof v !== 'number') throw new ModelError('E_TYPE', `measure "${m.raw}" must be a number, got ${kindOf(v)}`, { path: 'measure.of' });
    return v;
  };
  switch (m.agg) {
    case 'final': return val(K);
    case 'at': return val(tickAt(model, timeOf(m.t, model, trace.params, 'measure.t'), 'measure.t', 'round'));
    default: {
      let acc = m.agg === 'max' ? -Infinity : m.agg === 'min' ? Infinity : 0;
      for (let k = 0; k <= K; k++) {

function evaluateCompare(model, c, P, budget) {
  const side = (runs) => {
    const o = { ...P };
    const env = paramEnv(model, P);
    for (const r of runs) {
      const v = r.fn(env);
      if (typeof v !== 'number' || !Number.isFinite(v)) throw new ModelError('E_TYPE', `override for "${r.id}" must be a number`, { path: c.path });
      o[r.id] = v;

  };
  const Pa = side(c.runs.a);
  const Pb = side(c.runs.b);
  const ta = simulate(model, Pa, { budget });
  const tb = simulate(model, Pb, { budget });

  const b = measureRun(model, tb, c.measure);
  const env = paramEnv(model, P);
  env.cmp = { a, b };
  const ok = asBool(c.expect(env), { path: c.path + '.expect' });

}

// ---- all claims -----------------------------------------------------------

// Returns { trace, results: [ { id, kind, pass, status, text, line, counterexample, error, stats } ], passed, total }
function checkClaims(model, overrides, opts = {}) {
  const P = resolveParams(model, overrides);
  const budget = opts.budget || makeBudget();
  const simple = model.claims.filter((c) => c.kind !== 'sweep' && c.kind !== 'compare');
  const { trace, results } = evaluateOnRun(model, P, simple, { ...opts, budget });
  const out = [];
  for (const c of model.claims) {
    let r;
    try {
      if (c.kind === 'sweep') r = evaluateSweep(model, c, P, budget);
      else if (c.kind === 'compare') r = evaluateCompare(model, c, P, budget);
      else r = results.get(c);
    } catch (e) {
      if (!(e instanceof ModelError)) throw e;

    let text = c.raw;
    try { text = c.text ? c.text(paramEnv(model, P)) : c.raw; } catch { /* keep raw text */ }
    const res = { id: c.id, kind: c.kind, pass: r.pass, status: r.status, text };
    if (r.counterexample) res.counterexample = r.counterexample;
    if (r.error) res.error = errorToJSON(r.error);
    if (r.stats) res.stats = r.stats;
    res.line = r.pass ? '' : explain(model, c, res);
    out.push(res);
  }
  const passed = out.filter((r) => r.pass).length;
  return { trace, results: out, passed, total: out.length, params: P };
}

// ---- one-line explanations ------------------------------------------------

function fmtTime(model, t) {

function fmtValues(values) {

function fmtParams(model, ps) {

    if (p && p.choices) return `${k} = ${p.choices[Math.round((v - p.min) / p.step)] || formatValue(v)}`;
    return `${k} = ${formatValue(v, p && p.format)}${p && p.unit && p.unit.length <= 6 && p.format !== '%' ? ' ' + unitFor(v, p.unit) : ''}`;

function explain(model, claim, res) {

  const ce = res.counterexample;
  if (!ce) return '';
  switch (claim.kind) {
    case 'at':
    case 'always':
    case 'never':

    case 'eventually':
      return `still false at ${fmtTime(model, ce.t)}: ${fmtValues(ce.values)}`;
    case 'whenever':
      if (ce.deadline != null && ce.firedAt != null) {
        return `"${ce.event}" at ${fmtTime(model, ce.firedAt)} was not followed in time; at ${fmtTime(model, ce.t)}: ${fmtValues(ce.values)}`;
      }
      return `after "${ce.event}" at ${fmtTime(model, ce.t)}: ${[fmtValues(ce.values), ce.payload != null ? `payload = ${formatValue(ce.payload)}` : ''].filter(Boolean).join(', ') || 'the expression is false'}`;

      const at = fmtParams(model, ce.sample);
      if (ce.note === 'outside') return `at ${at} the claim still holds, although holdsWhen is false`;
      if (ce.note === 'none-inside') return 'no sampled params satisfy holdsWhen; widen the ranges';
      if (ce.note === 'none-outside') return 'every sampled param set satisfies holdsWhen, so its boundary is never tested; widen the ranges';
      if (ce.note === 'error') return `at ${at} the model fails: ${ce.error.code} ${ce.error.message}`;
      const inner = ce.t != null ? `${ce.deadline ? 'still false' : 'fails'} at ${fmtTime(model, ce.t)}: ${fmtValues(ce.values)}` : 'fails';
      return `at ${at}: ${inner}`;
    }
    case 'compare': {
      const m = claim.measure;
      const what = m.label || `${m.agg} of ${m.raw}`;
      return `${what}: a = ${formatValue(ce.a)} (${fmtParams(model, ce.overridesA)}), b = ${formatValue(ce.b)} (${fmtParams(model, ce.overridesB)})`;

// ---- lint.mjs ----
// Lint: an explainer must not lie.
//  W_LITERAL_NUMBER       a number typed into a caption or claim text instead of bound to the model
//  W_UNCITED_CLAIM        no caption points the reader at this claim

//  W_CONSTANT_CLAIM       the claim never looks at state or time, so it says nothing about behaviour
//  W_VACUOUS_CLAIM        the claim was never exercised (its event never fired)
//  W_NOT_BREAKABLE        no slider position makes any claim fail, so readers cannot see where it stops holding

const NUM_RE = /(?<![A-Za-z0-9_.])(\d+(?:\.\d+)?)(st|nd|rd|th|x|%)?(?![A-Za-z0-9_])/g;

  while ((m = NUM_RE.exec(lit))) out.push({ raw: m[0], value: Number(m[1]), suffix: m[2] || '' });

function suggestions(model, value, suffix) {
  const out = [];

    const d = p.default;
    if (suffix === '%' && Math.abs(d * 100 - value) < 1e-9) out.push(`{${p.id}:%}`);
    else if (Math.abs(d - value) < 1e-9) out.push(suffix && /st|nd|rd|th/.test(suffix) ? `{${p.id}:ord}` : `{${p.id}}`);
    else if (Math.abs(d + 1 - value) < 1e-9) out.push(suffix && /st|nd|rd|th/.test(suffix) ? `{${p.id} + 1:ord}` : `{${p.id} + 1}`);

  const byId = new Map((defaults ? defaults.results : []).map((r) => [r.id, r]));
  for (const c of model.claims) {
    if (!cited.has(c.id)) add('W_UNCITED_CLAIM', 'warning', `no caption cites claim "${c.id}"`, c.path, `add "${c.id}" to the cites of the caption where the reader sees it happen`);
  }
  for (const n of model.narration) {
    for (const id of n.cites) {
      const r = byId.get(id);
      if (r && !r.pass) add('E_CITES_FAILING_CLAIM', 'error', `caption cites claim "${id}", which fails at the default params`, n.path + '.cites', 'fix the model or the claim; never cite a claim that fails');

    const refs = inner.expr.refs;
    const dynamic = [...refs].some((r) => model.stateNames.includes(r) || model.derivedGetters.has(r) || r === 't' || r === 'tick' || r === 'payload' || r === 'seq' || r === 'batch');

      add('W_NOT_BREAKABLE', 'warning', 'no slider at either end makes any claim fail, so readers cannot see where the explanation stops holding', 'claims', 'add a claim that depends on a param, such as one that only holds while load stays below capacity');
    }
    for (const p of opts.probes) {
      if (p.errors.length) {
        add('W_PARAM_EXTREME_ERROR', 'warning', `with ${p.param} = ${autoNumber(p.value)} the model fails: ${p.errors[0]}`, `params.${p.param}`, 'guard the rule (for example max(x, tiny)) or narrow the slider range');
      }
    }
  }
  return issues;
}

// Try every slider at its min and max (others at default) and record which claims fail.
function probeParams(model) {
  const out = [];
  for (const p of model.params) {
    for (const value of [p.min, p.max]) {
      if (value === p.default) continue;
      const res = checkClaims(model, { [p.param || p.id]: value });
      const failing = res.results.filter((r) => !r.pass).map((r) => r.id);
      const errors = res.results.filter((r) => r.status === 'error').map((r) => `${r.error.code} ${r.error.message}`);

}

// ---- index.mjs ----
// Engine entry point. The same modules run in Node (check, build) and are
// inlined into every built page, so a claim that passes in the terminal
// passes in the browser for the same reason.



const ENGINE_VERSION = '0.1.0';

function nowMs() {
  return typeof performance !== 'undefined' && performance.now ? performance.now() : Date.now();
}

// Compile, simulate at the given params (defaults when omitted), check every
// claim, probe the sliders, and lint. Never throws for model problems; they
// come back in errors.
function analyze(spec, opts = {}) {
  const t0 = nowMs();

    results: [], passed: 0, total: 0, probes: [], ticks: model ? model.K : 0, ms: 0, model: null,
  };
  if (errors.length) { report.ms = nowMs() - t0; return report; }
  report.model = model;
  const res = checkClaims(model, opts.params);
  report.stage = 'simulate';
  if (res.trace.error) {
    report.errors = [res.trace.error];
    report.ms = nowMs() - t0;
    return report;
  }
  report.stage = 'claims';
  report.results = res.results;
  report.passed = res.passed;
  report.total = res.total;
  report.trace = res.trace;
  report.probes = opts.probe === false ? [] : probeParams(model);

    clock.textContent = fmtTime(k * model.dt);
    bPlay.innerHTML = '';
    bPlay.appendChild(icon(playing ? 'pause' : 'play'));
    bPlay.appendChild(document.createTextNode(playing ? 'Pause' : (t >= model.duration - 1e-9 ? 'Replay' : 'Play')));
    bPlay.setAttribute('aria-label', playing ? 'Pause' : 'Play');
  }

  function focusClaim(id) {
    var cv = claimViews.find(function (c) { return c.c.id === id; });
    if (!cv) return;
    cv.li.scrollIntoView({ block: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' });
    cv.li.classList.add('focus');
    setTimeout(function () { cv.li.classList.remove('focus'); }, 1200);
  }

  // ------------------------------------------------------------- control --
  function setTime(t) { T = clamp(t, 0, model.duration); render(); }
  function play() {
    if (T >= model.duration - 1e-9) T = 0;
    playing = true;
    lastNow = 0;
    requestAnimationFrame(loop);
    render();
  }
  function pause() { playing = false; render(); }
  function loop(now) {
    if (!playing) return;
    if (lastNow) {
      var dtr = Math.min(0.1, (now - lastNow) / 1000);
      T += dtr * baseSpeed * speedMul;
      if (T >= model.duration) { T = model.duration; playing = false; }
    }
    lastNow = now;
    render();
    if (playing) requestAnimationFrame(loop);
  }
  function step(n) { pause(); setTime(Math.round(T / model.dt + n) * model.dt); }
  function resetParams() {
    params = Object.assign({}, defaults);
    paramViews.forEach(updateParamView);
    recompute();
    render();
  }
  function setParam(id, value) {
    var pv = paramViews.find(function (q) { return q.p.id === id; });
    if (!pv) throw new Error('unknown param ' + id);
    params[id] = Number(value);
    updateParamView(pv);
    recompute();
    render();
  }

  bPlay.addEventListener('click', function () { if (playing) pause(); else play(); });
  bBack.addEventListener('click', function () { step(-1); });
  bFwd.addEventListener('click', function () { step(1); });
  // keyboard and assistive tech drive the native input; the pointer drives the drawn thumb
  scrub.addEventListener('input', function () { playing = false; T = Number(scrub.value); render(); });

  // ------------------------------------------------------------ scrubber --
  // Pointer capture, the grab offset kept, 1:1 tracking. Past either end the
  // thumb rubber-bands (Fluid.rubber); on release it springs back inside the
  // track (damping 1, response 0.4) carrying the release velocity. No momentum
  // projection: a timeline needs precision.
  var scrubOver = 0;
  var thumbScale = 1;
  var overSp = Fluid.spring({ value: 0, response: 0.4, damping: 1, onUpdate: function (x) { scrubOver = x; drawThumb(); } });
  var thumbSp = Fluid.spring({ value: 1, response: 0.18, damping: 1, onUpdate: function (x) { thumbScale = x; drawThumb(); } });
  var scrubVel = Fluid.velocityTracker();
  var drag = null;
  function drawThumb() {
    var w = track.clientWidth || 0;
    var f = clamp(T / model.duration, 0, 1);
    trackFill.style.transform = 'scaleX(' + f.toFixed(4) + ')';
    thumb.style.transform = 'translateX(' + (f * w + scrubOver).toFixed(2) + 'px)' + (thumbScale !== 1 ? ' scale(' + thumbScale.toFixed(4) + ')' : '');
  }
  function dragTo(x) {
    var r = track.getBoundingClientRect();
    var w = Math.max(1, r.width);
    var raw = x - drag.grab - r.left;
    var over = raw < 0 ? Fluid.rubber(raw, w) : raw > w ? Fluid.rubber(raw - w, w) : 0;
    scrubVel.add(over);
    overSp.set(over);
    setTime(clamp(raw / w, 0, 1) * model.duration);
  }
  function endDrag() {
    if (!drag) return;
    drag = null;
    scrubWrap.removeAttribute('data-pressed');
    thumbSp.to(1, { response: 0.3, damping: 0.8 });
    overSp.to(0, { velocity: scrubVel.get() });
  }
  scrubWrap.addEventListener('pointerdown', function (e) {
    if (e.button > 0) return;
    e.preventDefault();
    var r = track.getBoundingClientRect();
    var thumbX = r.left + clamp(T / model.duration, 0, 1) * r.width;
    // grabbing the thumb keeps the finger's offset from its centre; pressing the bare track brings the thumb under the pointer
    drag = { id: e.pointerId, grab: Math.abs(e.clientX - thumbX) <= 14 ? e.clientX - thumbX : 0 };
    try { scrubWrap.setPointerCapture(e.pointerId); } catch (err) { /* a synthetic event has no capture */ }
    scrubWrap.setAttribute('data-pressed', '');
    if (playing) pause();
    scrubVel.reset();
    overSp.stop();
    if (!Fluid.reduce()) thumbSp.to(1.18, { response: 0.18, damping: 1 });
    dragTo(e.clientX);
  });
  scrubWrap.addEventListener('pointermove', function (e) { if (drag && e.pointerId === drag.id) dragTo(e.clientX); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (n) { scrubWrap.addEventListener(n, function (e) { if (drag && e.pointerId === drag.id) endDrag(); }); });
  document.addEventListener('keydown', function (e) {
    var tg = e.target;
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    // sliders and text fields keep their own keys; buttons keep Space and Enter
    if (tg && tg.closest && tg.closest('input, select, textarea, [contenteditable="true"]')) return;
    var onButton = tg && tg.closest && tg.closest('button, a');
    if (e.key === ' ' || e.code === 'Space') { if (onButton) return; e.preventDefault(); if (playing) pause(); else play(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); step(e.shiftKey ? 10 : 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); step(e.shiftKey ? -10 : -1); }
    else if (e.key === 'Home') { e.preventDefault(); pause(); setTime(0); }
    else if (e.key === 'End') { e.preventDefault(); pause(); setTime(model.duration); }
  });
  if (window.ResizeObserver) new ResizeObserver(function () { applyScale(); render(); }).observe(svg);
  window.addEventListener('resize', function () { applyScale(); render(); });

  // ------------------------------------------------------- layout report --
  function rectIn(a, b, tol) { return a.left >= b.left - tol && a.right <= b.right + tol && a.top >= b.top - tol && a.bottom <= b.bottom + tol; }
  function layoutReport() {
    applyScale();
    var issues = [];
    var add = function (code, msg, part) { issues.push({ code: code, message: msg, part: part || null }); };
    var sv = svg.getBoundingClientRect();
    var solid = [];
    views.forEach(function (v) {
      if (v.g.style.display === 'none') return;
      if (v.part.type === 'link') {
        var lb = v.path.getBoundingClientRect();
        if (lb.width + lb.height > 0 && !rectIn(lb, sv, 2)) add('E_OUT_OF_VIEW', 'link "' + v.part.id + '" leaves the diagram', v.part.id);
        // an arrow drawn across another part hides it and reads as a wrong connection
        if (v.len) {
          var crossed = null;
          views.forEach(function (o) {
            if (crossed || o === v || o.part.type === 'link' || o.part.type === 'group' || !o.anchor) return;
            if (o.part.id === v.part.from || o.part.id === v.part.to || o.g.style.display === 'none') return;
            var a = o.anchor;
            for (var u = 0.1; u <= 0.9001; u += 0.05) {
              var q = v.pointAt(u);
              if (q[0] > a.x + 3 && q[0] < a.x + a.w - 3 && q[1] > a.y + 3 && q[1] < a.y + a.h - 3) { crossed = o.part.id; return; }
            }
          });
          if (crossed) add('W_LINK_CROSSES', 'link "' + v.part.id + '" is drawn across part "' + crossed + '"; move a part or add "via" points', v.part.id);
        }
        return;
      }
      var b = v.bounds.getBoundingClientRect();
      if (!rectIn(b, sv, 1.5)) add('E_OUT_OF_VIEW', 'part "' + v.part.id + '" is outside the diagram', v.part.id);
      if (v.part.type !== 'group') solid.push({ id: v.part.id, b: b });
      var all = v.texts.slice();
      if (v.pills) v.pills.forEach(function (pl) {
        if (pl.rect.parentNode.style.display === 'none') return;
        var pb = pl.rect.getBoundingClientRect();
        var tb = pl.t.el.getBoundingClientRect();
        if (tb.width && !rectIn(tb, pb, 2)) add('E_TEXT_OVERFLOW', 'state "' + pl.t.str + '" spills out of its pill in part "' + v.part.id + '"', v.part.id);
      });
      if (v.extraTexts) all = all.concat(v.extraTexts());
      var boxes = [];
      all.forEach(function (t) {
        if (!t.str) return;
        var tb = t.el.getBoundingClientRect();
        if (tb.width === 0 && tb.height === 0) return;
        if (t.el.closest('g') && t.el.closest('g').style.display === 'none') return;
        var box = b;
        if (v.part.type === 'group') box = { left: b.left - 12, right: b.right + 12, top: b.top - 16, bottom: b.bottom + 12 };
        if (!rectIn(tb, box, 1.5)) add('E_TEXT_OVERFLOW', 'text "' + t.str + '" spills out of part "' + v.part.id + '"', v.part.id);
        var px = t.fs * scale;
        if (px < 7.5) add('W_TEXT_SMALL', 'text "' + t.str + '" in part "' + v.part.id + '" renders at ' + px.toFixed(1) + 'px', v.part.id);
        boxes.push({ t: t, b: tb });
      });
      for (var bi = 0; bi < boxes.length; bi++) {
        for (var bj = bi + 1; bj < boxes.length; bj++) {
          var A = boxes[bi].b;
          var B = boxes[bj].b;
          var ix = Math.min(A.right, B.right) - Math.max(A.left, B.left);
          var iy = Math.min(A.bottom, B.bottom) - Math.max(A.top, B.top);
          if (ix > 1.5 && iy > 1.5) add('E_TEXT_COLLISION', 'texts "' + boxes[bi].t.str + '" and "' + boxes[bj].t.str + '" overlap in part "' + v.part.id + '"', v.part.id);
        }
      }
    });
    for (var i = 0; i < solid.length; i++) {
      for (var j = i + 1; j < solid.length; j++) {
        var a = solid[i].b;
        var c = solid[j].b;
        var ox = Math.min(a.right, c.right) - Math.max(a.left, c.left);
        var oy = Math.min(a.bottom, c.bottom) - Math.max(a.top, c.top);
        if (ox > 1 && oy > 1) add('E_LAYOUT_OVERLAP', 'parts "' + solid[i].id + '" and "' + solid[j].id + '" overlap', solid[j].id);
      }
    }
    var vw = document.documentElement.clientWidth;
    if (document.documentElement.scrollWidth > vw + 1) add('E_PAGE_OVERFLOW', 'the page scrolls sideways (' + document.documentElement.scrollWidth + 'px content in a ' + vw + 'px window)');
    var htmlText = root.querySelectorAll('.wm-title, .wm-summary, .wm-caption-text, .wm-claim .text, .wm-claim .why, .wm-param label, .wm-btn, .wm-clock, .wm-counter');
    Array.prototype.forEach.call(htmlText, function (e) {
      if (e.offsetParent === null) return;
      var rb = e.getBoundingClientRect();
      if (rb.right > vw + 1 || rb.left < -1) add('E_OUT_OF_VIEW', 'element "' + (e.className || e.tagName) + '" is outside the window');
      if (e.scrollWidth > e.clientWidth + 2 && getComputedStyle(e).overflowX !== 'visible') add('E_TEXT_CLIPPED', 'text in "' + e.className + '" is clipped');
    });
    if (bindingErrors.length) bindingErrors.forEach(function (m) { add('E_BINDING', m); });
    var seen = {};
    return issues.filter(function (x) { var key = x.code + x.message; if (seen[key]) return false; seen[key] = 1; return true; });
  }

  // ---------------------------------------------------------------- boot --
  recompute();
  applyScale(true);
  render();
  window.workingModel = {
    ready: true,
    model: model,
    get time() { return T; },
    setTime: setTime,
    play: play,
    pause: pause,
    setParam: setParam,
    resetParams: resetParams,
    getParams: function () { return Object.assign({}, params); },
    getSummary: function () {
      return {
        passed: check.passed, total: check.total,
        mutation: mutation,
        results: check.results.map(function (r) { return { id: r.id, pass: r.pass, status: r.status, line: r.line }; }),
      };
    },
    layoutReport: layoutReport,
    bindingErrors: function () { return bindingErrors.slice(); },
    render: function () { applyScale(true); render(); },
  };
  if (!reduceMotion && !(model.playback && model.playback.autoplay === false) && !/[?#&]still\b/.test(location.href)) {
    setTimeout(function () { if (!playing && T === 0) play(); }, 600);
  }
})();

</script>
</body>
</html>
